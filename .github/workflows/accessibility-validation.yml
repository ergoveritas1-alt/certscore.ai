name: Accessibility Validation

on:
  pull_request:
    paths:
      - ".github/workflows/accessibility-validation.yml"
      - "apps/validation-worker/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/validation-shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility-validation.yml"
      - "apps/validation-worker/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/validation-shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

jobs:
  worker-scan-pipeline-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @website-signal-risk-scanner/validation-worker exec playwright install chromium

      - name: Typecheck validation-worker
        run: pnpm --filter @website-signal-risk-scanner/validation-worker typecheck

      - name: Run scan pipeline tests
        run: pnpm test:scan-pipeline

  live-validation-smoke:
    runs-on: ubuntu-latest
    needs: worker-scan-pipeline-tests
    if: ${{ secrets.DATABASE_URL != '' && secrets.NEXT_PUBLIC_APP_URL != '' && secrets.REDIS_URL != '' && secrets.S3_BUCKET != '' && secrets.S3_REGION != '' && secrets.S3_ACCESS_KEY_ID != '' && secrets.S3_SECRET_ACCESS_KEY != '' }}
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @website-signal-risk-scanner/validation-worker exec playwright install chromium

      - name: Create web env file
        working-directory: apps/web
        run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          S3_BUCKET=${S3_BUCKET}
          S3_REGION=${S3_REGION}
          S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
          S3_ENDPOINT=${S3_ENDPOINT}
          S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
          EOF

      - name: Run live validation smoke
        run: pnpm --filter @website-signal-risk-scanner/validation-worker smoke:validation
