name: ADA Live Verification

on:
  workflow_dispatch:
    inputs:
      ada_scan_domain:
        description: "Domain to queue for fresh ADA verification when ADA scan ID/URL are not provided."
        required: false
        default: "w3.org"
        type: string
      ada_scan_id:
        description: "Optional existing ADA scan ID to verify."
        required: false
        type: string
      ada_scan_url:
        description: "Optional existing ADA scan URL to verify."
        required: false
        type: string
      financial_empty_scan_url:
        description: "Optional scan URL expected to show Financial & commercial claims as Audit-only."
        required: false
        type: string

jobs:
  verify-ada-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      LIVE_BASE_URL: ${{ vars.AWS_WEB_CERTSCORE_BASE_URL || 'https://certscore.ai' }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
      ADA_SCAN_DOMAIN: ${{ inputs.ada_scan_domain }}
      ADA_SCAN_ID: ${{ inputs.ada_scan_id }}
      ADA_SCAN_URL: ${{ inputs.ada_scan_url }}
      FINANCIAL_EMPTY_SCAN_URL: ${{ inputs.financial_empty_scan_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate verification configuration
        run: |
          test -n "${DATABASE_URL}" || (echo "Missing secret PROD_DATABASE_URL or DATABASE_URL" && exit 1)
          test -n "${LIVE_BASE_URL}" || (echo "Missing var AWS_WEB_CERTSCORE_BASE_URL" && exit 1)
          case "${DATABASE_URL}" in
            *localhost*|*127.0.0.1*|*"[::1]"*|*"@::1"*)
              echo "DATABASE_URL points at a local database. Set PROD_DATABASE_URL to the live DB."
              exit 1
              ;;
          esac
          if { [ -n "${ADA_SCAN_ID}" ] && [ -z "${ADA_SCAN_URL}" ]; } || { [ -z "${ADA_SCAN_ID}" ] && [ -n "${ADA_SCAN_URL}" ]; }; then
            echo "Provide both ada_scan_id and ada_scan_url, or neither to queue a fresh scan."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ADA live verification
        run: pnpm ops:verify:ada-live
