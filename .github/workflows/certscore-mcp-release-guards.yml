name: CertScore MCP Release Guards

on:
  pull_request:
    paths:
      - ".github/workflows/certscore-mcp-release-guards.yml"
      - "Casks/certscore-mcp.rb"
      - "Formula/certscore-mcp.rb"
      - "apps/web/app/.well-known/certscore-ai.json/route.ts"
      - "apps/web/app/api-pulse/page.tsx"
      - "apps/web/app/developers/**"
      - "apps/web/lib/pulse/support-routes.test.ts"
      - "apps/web/public/llms.txt"
      - "apps/web/public/llms-full.txt"
      - "packages/certscore-api-contracts/src/mcp.ts"
      - "packages/certscore-mcp/**"
      - "scripts/smoke-mcp.sh"
      - "scripts/verify-llms-discovery-docs.ts"
      - "scripts/verify-certscore-mcp-release-guards.ts"
  push:
    branches:
      - main
    tags:
      - "certscore-mcp-v*"
    paths:
      - ".github/workflows/certscore-mcp-release-guards.yml"
      - "Casks/certscore-mcp.rb"
      - "Formula/certscore-mcp.rb"
      - "apps/web/app/.well-known/certscore-ai.json/route.ts"
      - "apps/web/app/api-pulse/page.tsx"
      - "apps/web/app/developers/**"
      - "apps/web/lib/pulse/support-routes.test.ts"
      - "apps/web/public/llms.txt"
      - "apps/web/public/llms-full.txt"
      - "packages/certscore-api-contracts/src/mcp.ts"
      - "packages/certscore-mcp/**"
      - "scripts/smoke-mcp.sh"
      - "scripts/verify-llms-discovery-docs.ts"
      - "scripts/verify-certscore-mcp-release-guards.ts"

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP dependencies
        run: |
          pnpm --filter @certscore/api-contracts build
          pnpm --filter @certscore/sdk build

      - name: Test MCP package
        run: |
          pnpm --filter certscore-mcp typecheck
          pnpm --filter certscore-mcp test
          pnpm --filter certscore-mcp build

      - name: Verify release drift guards
        run: node --import tsx scripts/verify-certscore-mcp-release-guards.ts

      - name: Verify LLM discovery docs
        run: node --import tsx scripts/verify-llms-discovery-docs.ts
