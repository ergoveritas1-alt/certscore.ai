name: Production DB Migrate

on:
  workflow_dispatch:

concurrency:
  group: production-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PGCONNECT_TIMEOUT: "15"
      PGOPTIONS: "-c lock_timeout=10000 -c statement_timeout=60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate database configuration
        run: |
          test -n "${DATABASE_URL}" || (echo "Missing secret PROD_DATABASE_URL" && exit 1)
          case "${DATABASE_URL}" in
            *127.0.0.1*|*localhost*) echo "DATABASE_URL points at a local database." && exit 1 ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate
