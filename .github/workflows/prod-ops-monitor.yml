name: Production Ops Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      synthetic_scan:
        description: "Queue and wait for a synthetic homepage scan."
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_VALIDATION_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      AWS_VALIDATION_ECS_CLUSTER: ${{ vars.AWS_VALIDATION_ECS_CLUSTER }}
      AWS_VALIDATION_ECS_WORKER_SERVICE: ${{ vars.AWS_VALIDATION_ECS_WORKER_SERVICE }}
      AWS_WEB_CERTSCORE_SERVICE: ${{ vars.AWS_WEB_CERTSCORE_SERVICE }}
      AWS_WEB_ECS_CLUSTER: ${{ vars.AWS_WEB_ECS_CLUSTER }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
      FEEDBACK_TO_EMAIL: ${{ secrets.FEEDBACK_TO_EMAIL }}
      GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
      GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
      OPS_ALERT_ENVIRONMENT: production
      OPS_ALERT_TO_EMAIL: ${{ secrets.OPS_ALERT_TO_EMAIL || secrets.FEEDBACK_TO_EMAIL }}
      OPS_AWS_DB_PROBE_ENABLED: ${{ vars.OPS_AWS_DB_PROBE_ENABLED || 'false' }}
      OPS_AWS_MONITOR_ECS_CLUSTER: ${{ vars.OPS_AWS_MONITOR_ECS_CLUSTER || vars.OPS_RUNNER_ECS_CLUSTER || vars.AWS_VALIDATION_ECS_CLUSTER }}
      OPS_AWS_MONITOR_ECS_SERVICE: ${{ vars.OPS_AWS_MONITOR_ECS_SERVICE || vars.OPS_RUNNER_ECS_SERVICE || vars.AWS_VALIDATION_ECS_WORKER_SERVICE }}
      OPS_BASE_URL: ${{ vars.AWS_WEB_CERTSCORE_BASE_URL || 'https://certscore.ai' }}
      OPS_REQUIRE_DIRECT_DATABASE: ${{ vars.OPS_REQUIRE_DIRECT_DATABASE || 'false' }}
      OPS_REQUIRE_SCANNER_HEARTBEAT: ${{ vars.OPS_REQUIRE_SCANNER_HEARTBEAT || 'false' }}
      OPS_REQUIRE_VALIDATION_HEARTBEAT: ${{ vars.OPS_REQUIRE_VALIDATION_HEARTBEAT || 'true' }}
      OPS_SCAN_QUEUE_STALE_MINUTES: ${{ vars.OPS_SCAN_QUEUE_STALE_MINUTES || '10' }}
      OPS_SCHEDULED_MONITORING_CANARY_DOMAIN: ${{ vars.OPS_SCHEDULED_MONITORING_CANARY_DOMAIN || vars.OPS_SYNTHETIC_SCAN_DOMAIN || 'ergoveritas.com' }}
      OPS_SCHEDULED_MONITORING_SWEEP_ENABLED: ${{ vars.OPS_SCHEDULED_MONITORING_SWEEP_ENABLED || 'false' }}
      OPS_SCHEDULED_MONITORING_SWEEP_LIMIT: ${{ vars.OPS_SCHEDULED_MONITORING_SWEEP_LIMIT || '1' }}
      OPS_SYNTHETIC_SCAN_DOMAIN: ${{ vars.OPS_SYNTHETIC_SCAN_DOMAIN || 'ergoveritas.com' }}
      OPS_SYNTHETIC_SCAN_ENABLED: ${{ inputs.synthetic_scan || vars.OPS_SYNTHETIC_SCAN_ENABLED || 'false' }}
      OPS_SYNTHETIC_SCAN_TIMEOUT_MINUTES: ${{ vars.OPS_SYNTHETIC_SCAN_TIMEOUT_MINUTES || '15' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate monitor configuration
        run: |
          test -n "${OPS_BASE_URL}" || (echo "Missing OPS_BASE_URL" && exit 1)
          if [ "${OPS_REQUIRE_DIRECT_DATABASE}" = "true" ]; then
            test -n "${DATABASE_URL}" || (echo "Missing secret PROD_DATABASE_URL or DATABASE_URL" && exit 1)
          fi
          if [ "${OPS_SCHEDULED_MONITORING_SWEEP_ENABLED}" = "true" ]; then
            test -n "${DATABASE_URL}" || (echo "Missing secret PROD_DATABASE_URL or DATABASE_URL for scheduled monitoring sweep" && exit 1)
          fi
          if [ "${OPS_AWS_DB_PROBE_ENABLED}" = "true" ]; then
            test -n "${AWS_ROLE_TO_ASSUME}" || (echo "Missing secret AWS_ROLE_TO_ASSUME" && exit 1)
            test -n "${OPS_AWS_MONITOR_ECS_CLUSTER}" || (echo "Missing var OPS_AWS_MONITOR_ECS_CLUSTER or AWS_VALIDATION_ECS_CLUSTER" && exit 1)
            test -n "${OPS_AWS_MONITOR_ECS_SERVICE}" || (echo "Missing var OPS_AWS_MONITOR_ECS_SERVICE or AWS_VALIDATION_ECS_WORKER_SERVICE" && exit 1)
          fi
          if [ -n "${DATABASE_URL}" ]; then
            case "${DATABASE_URL}" in
              *localhost*|*127.0.0.1*|*"[::1]"*|*"@::1"*)
                echo "DATABASE_URL points at a local database. Set PROD_DATABASE_URL to the live DB."
                exit 1
                ;;
            esac
          fi

      - name: Configure AWS credentials
        if: ${{ env.OPS_AWS_DB_PROBE_ENABLED == 'true' || env.AWS_WEB_ECS_CLUSTER != '' || env.AWS_VALIDATION_ECS_WORKER_SERVICE != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production monitor
        run: pnpm ops:monitor:prod

      - name: Run scheduled monitoring sweep
        if: ${{ env.OPS_SCHEDULED_MONITORING_SWEEP_ENABLED == 'true' }}
        env:
          OPS_AWS_DB_PROBE_COMMAND: node --enable-source-maps ./apps/validation-worker/dist/apps/validation-worker/scripts/run-scheduled-monitoring-sweep.js --limit=${{ env.OPS_SCHEDULED_MONITORING_SWEEP_LIMIT }} --canary-domain=${{ env.OPS_SCHEDULED_MONITORING_CANARY_DOMAIN }}
        run: pnpm ops:monitor:prod:aws

      - name: Run AWS-side database and worker probe
        if: ${{ env.OPS_AWS_DB_PROBE_ENABLED == 'true' }}
        run: pnpm ops:monitor:prod:aws
