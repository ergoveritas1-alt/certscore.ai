name: v2 Regulatory Gold Corpus

on:
  pull_request:
    paths:
      - ".github/workflows/v2-regulatory-gold-corpus.yml"
      - "artifacts/gold-corpus/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-v2-regulatory-gold-corpus-stage1.ts"
      - "scripts/build-v2-regulatory-gold-corpus-stage2.ts"
      - "scripts/build-v2-regulatory-gold-corpus-stage3-fixtures.ts"
      - "scripts/analyze-v2-regulatory-confidence.ts"
      - "scripts/verify-v2-regulatory-gold-corpus-stage2.ts"
      - "scripts/verify-v2-regulatory-lane-quality.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v2-regulatory-gold-corpus.yml"
      - "artifacts/gold-corpus/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-v2-regulatory-gold-corpus-stage1.ts"
      - "scripts/build-v2-regulatory-gold-corpus-stage2.ts"
      - "scripts/build-v2-regulatory-gold-corpus-stage3-fixtures.ts"
      - "scripts/analyze-v2-regulatory-confidence.ts"
      - "scripts/verify-v2-regulatory-gold-corpus-stage2.ts"
      - "scripts/verify-v2-regulatory-lane-quality.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild corpus indexes
        id: corpus
        run: |
          node --import tsx ./scripts/build-v2-regulatory-gold-corpus-stage1.ts
          node --import tsx ./scripts/build-v2-regulatory-gold-corpus-stage2.ts
          candidate_count="$(node -e 'const fs = require("node:fs"); const path = "artifacts/gold-corpus/v2-20260613-stage2/promoted-gold-examples.json"; const payload = JSON.parse(fs.readFileSync(path, "utf8")); process.stdout.write(String(payload.summary?.candidateExamples ?? 0));')"
          echo "candidate_count=${candidate_count}" >> "$GITHUB_OUTPUT"
          if [ "${candidate_count}" -gt 0 ]; then
            echo "has_artifact_inventory=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifact_inventory=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No captured v2 regulatory artifact inventory is present in this CI checkout; skipping artifact-backed corpus gates."
          fi

      - name: Verify corpus indexes
        if: steps.corpus.outputs.has_artifact_inventory == 'true'
        run: pnpm v2:regulatory-gold-corpus-verify

      - name: Build and verify synthetic fixtures
        if: steps.corpus.outputs.has_artifact_inventory == 'true'
        run: pnpm v2:regulatory-gold-corpus-fixtures

      - name: Calibrate confidence and verify lane quality
        if: steps.corpus.outputs.has_artifact_inventory == 'true'
        run: |
          pnpm v2:regulatory-confidence-calibration
          pnpm v2:regulatory-lane-quality

      - name: Typecheck corpus tooling
        run: |
          pnpm exec tsc --noEmit --pretty false --module NodeNext --moduleResolution NodeNext --target ES2022 --types node --skipLibCheck \
            scripts/build-v2-regulatory-gold-corpus-stage1.ts \
            scripts/build-v2-regulatory-gold-corpus-stage2.ts \
            scripts/build-v2-regulatory-gold-corpus-stage3-fixtures.ts \
            scripts/analyze-v2-regulatory-confidence.ts \
            scripts/verify-v2-regulatory-gold-corpus-stage2.ts \
            scripts/verify-v2-regulatory-lane-quality.ts
