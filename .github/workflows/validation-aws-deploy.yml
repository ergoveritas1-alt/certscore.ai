name: Validation AWS Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/validation-aws-deploy.yml"
      - "apps/validation-worker/**"
      - "apps/web/lib/scans/**"
      - "apps/web/server/scans/**"
      - "apps/web/package.json"
      - "infra/aws/validation/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/validation-shared/**"
      - "packages/web-bot-auth/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "!apps/validation-worker/**/*.test.ts"
      - "!apps/validation-worker/**/*.spec.ts"
      - "!apps/validation-worker/scripts/**"
      - "!apps/web/**/*.test.ts"
      - "!apps/web/**/*.test.tsx"
      - "!apps/web/**/*.spec.ts"
      - "!apps/web/**/*.spec.tsx"
  workflow_dispatch:
    inputs:
      use_runtime_base:
        description: "Use the prebuilt validation worker runtime base image."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      push_runtime_base:
        description: "Build and push the validation worker runtime base before the app image."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      runtime_base_tag:
        description: "Validation worker runtime base tag to use or publish."
        required: false
        default: "validation-worker-runtime-base"

concurrency:
  group: validation-aws-production
  cancel-in-progress: false

jobs:
  deploy-validation-aws:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_VALIDATION_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      ECR_WORKER_REPOSITORY: ${{ vars.AWS_VALIDATION_WORKER_ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.AWS_VALIDATION_ECS_CLUSTER }}
      ECS_WORKER_SERVICE_NAME: ${{ vars.AWS_VALIDATION_ECS_WORKER_SERVICE }}
      ECS_WORKER_CONTAINER_NAME: ${{ vars.AWS_VALIDATION_ECS_WORKER_CONTAINER || 'validation-worker' }}
      ECS_WORKER_LOG_GROUP: ${{ vars.AWS_VALIDATION_ECS_WORKER_LOG_GROUP }}
      ECS_WORKER_CPU: "512"
      ECS_WORKER_MEMORY: "1024"
      VALIDATION_WORKER_USE_RUNTIME_BASE: ${{ github.event.inputs.use_runtime_base || vars.VALIDATION_WORKER_USE_RUNTIME_BASE || 'true' }}
      VALIDATION_WORKER_PUSH_RUNTIME_BASE: ${{ github.event.inputs.push_runtime_base || vars.VALIDATION_WORKER_PUSH_RUNTIME_BASE || 'false' }}
      VALIDATION_WORKER_RUNTIME_BASE_TAG: ${{ github.event.inputs.runtime_base_tag || vars.VALIDATION_WORKER_RUNTIME_BASE_TAG || 'validation-worker-runtime-base' }}
      VALIDATION_WORKER_RUNTIME_BASE_CACHE_TAG: ${{ vars.VALIDATION_WORKER_RUNTIME_BASE_CACHE_TAG || 'validation-worker-runtime-base-cache' }}
      VALIDATION_WORKER_LAMBDA_RESULT_POLL_ENABLED: "1"
      VALIDATION_WORKER_LAMBDA_RESULT_POLL_SECONDS: "2"
      CERTSCORE_REVIEW_MODEL: ${{ vars.CERTSCORE_REVIEW_MODEL || 'gpt-5.4-mini' }}
      CERTSCORE_ROUTINE_REVIEW_MODEL: ${{ vars.CERTSCORE_ROUTINE_REVIEW_MODEL || 'gpt-5.4-nano' }}
      CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED: ${{ vars.CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED || '0' }}
      CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED: ${{ vars.CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED || '0' }}
      CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED: ${{ vars.CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED || '0' }}
      CERTSCORE_MINI_REVIEW_ENABLED: "1"
      CERTSCORE_MODEL_REVIEW_MODE: "enforced"
      CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED: "1"
      CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report deploy-triggering changes
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${{ github.event.before }}" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          echo "Deploy trigger: validation worker"
          echo "Base ref: ${base_ref}"
          echo "Head ref: ${GITHUB_SHA}"
          echo
          echo "Changed files considered by this deploy:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | sed 's/^/  - /'
          echo
          echo "Deploy categories:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | awk '
            /^apps\/validation-worker\// { worker=1 }
            /^apps\/validation-worker\/scripts\// { worker_scripts=1 }
            /^apps\/validation-worker\/.*\.(test|spec)\.ts$/ { worker_tests=1 }
            /^apps\/web\/lib\/scans\// || /^apps\/web\/server\/scans\// { surfacing=1 }
            /^apps\/web\/.*\.(test|spec)\.(ts|tsx)$/ { web_tests=1 }
            /^packages\/(shared|db|validation-shared|web-bot-auth)\// { pkg=1 }
            /^infra\/aws\/validation\// { infra=1 }
            /^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json|\.dockerignore)$/ { build=1 }
            /^\.github\/workflows\/validation-aws-deploy\.yml$/ { workflow=1 }
            END {
              if (worker) print "  - validation worker source"
              if (worker_scripts) print "  - validation worker script-only change"
              if (worker_tests) print "  - validation worker test-only change"
              if (surfacing) print "  - web scan/finding surfacing dependency"
              if (web_tests) print "  - web scan/finding test-only change"
              if (pkg) print "  - validation runtime package"
              if (infra) print "  - validation infrastructure"
              if (build) print "  - build/dependency config"
              if (workflow) print "  - deploy workflow"
            }
          '

          {
            echo "VALIDATION_DEPLOY_BASE_REF=${base_ref}"
            if git diff --name-only "${base_ref}" "${GITHUB_SHA}" | grep -Eq '^(apps/validation-worker/Dockerfile|apps/validation-worker/package\.json|pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|\.npmrc)$'; then
              echo "VALIDATION_RUNTIME_INPUTS_CHANGED=1"
            else
              echo "VALIDATION_RUNTIME_INPUTS_CHANGED=0"
            fi
          } >> "${GITHUB_ENV}"

      - name: Validate deploy configuration
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || (echo "Missing secret AWS_ROLE_TO_ASSUME" && exit 1)
          test -n "${ECR_WORKER_REPOSITORY}" || (echo "Missing var AWS_VALIDATION_WORKER_ECR_REPOSITORY" && exit 1)
          test -n "${ECS_CLUSTER_NAME}" || (echo "Missing var AWS_VALIDATION_ECS_CLUSTER" && exit 1)
          test -n "${ECS_WORKER_SERVICE_NAME}" || (echo "Missing var AWS_VALIDATION_ECS_WORKER_SERVICE" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck validation worker
        run: pnpm --filter @website-signal-risk-scanner/validation-worker typecheck

      - name: Run validation pipeline tests
        run: pnpm test:scan-pipeline

      - name: Resolve validation worker runtime base mode
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          WORKER_IMAGE="${REGISTRY}/${ECR_WORKER_REPOSITORY}"
          WORKER_RUNTIME_BASE_IMAGE="${WORKER_IMAGE}:${VALIDATION_WORKER_RUNTIME_BASE_TAG}"
          WORKER_RUNTIME_BASE_CACHE="${WORKER_IMAGE}:${VALIDATION_WORKER_RUNTIME_BASE_CACHE_TAG}"

          echo "VALIDATION_WORKER_IMAGE=${WORKER_IMAGE}" >> "${GITHUB_ENV}"
          echo "VALIDATION_WORKER_RUNTIME_BASE_IMAGE=${WORKER_RUNTIME_BASE_IMAGE}" >> "${GITHUB_ENV}"
          echo "VALIDATION_WORKER_RUNTIME_BASE_CACHE=${WORKER_RUNTIME_BASE_CACHE}" >> "${GITHUB_ENV}"

          echo "Validation worker runtime base mode:"
          echo "  use_runtime_base=${VALIDATION_WORKER_USE_RUNTIME_BASE}"
          echo "  push_runtime_base=${VALIDATION_WORKER_PUSH_RUNTIME_BASE}"
          echo "  runtime_base_image=${WORKER_RUNTIME_BASE_IMAGE}"
          echo "  runtime_inputs_changed=${VALIDATION_RUNTIME_INPUTS_CHANGED:-unknown}"

          if [[ "${VALIDATION_WORKER_USE_RUNTIME_BASE}" != "true" && "${VALIDATION_WORKER_USE_RUNTIME_BASE}" != "false" ]]; then
            echo "VALIDATION_WORKER_USE_RUNTIME_BASE must be true or false."
            exit 1
          fi
          if [[ "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "true" && "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "false" ]]; then
            echo "VALIDATION_WORKER_PUSH_RUNTIME_BASE must be true or false."
            exit 1
          fi

          if [[ "${VALIDATION_WORKER_USE_RUNTIME_BASE}" == "true" && "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "true" ]]; then
            if ! docker buildx imagetools inspect "${WORKER_RUNTIME_BASE_IMAGE}" >/dev/null 2>&1; then
              echo "Missing validation worker runtime base image: ${WORKER_RUNTIME_BASE_IMAGE}"
              echo "Bootstrap it with workflow_dispatch push_runtime_base=true, or set VALIDATION_WORKER_USE_RUNTIME_BASE=false for a one-off full image build."
              exit 1
            fi
          fi

          if [[ "${VALIDATION_RUNTIME_INPUTS_CHANGED:-0}" == "1" && "${VALIDATION_WORKER_USE_RUNTIME_BASE}" == "true" && "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "true" ]]; then
            echo "Validation worker runtime inputs changed, but push_runtime_base is false."
            echo "Re-run with workflow_dispatch push_runtime_base=true so Playwright/Chromium/runtime dependencies are rebuilt intentionally."
            exit 1
          fi

      - name: Build and push validation worker runtime base
        if: ${{ env.VALIDATION_WORKER_PUSH_RUNTIME_BASE == 'true' }}
        run: |
          docker buildx build \
            --provenance=false \
            --sbom=false \
            --target validation-worker-runtime-base \
            --cache-from "type=registry,ref=${VALIDATION_WORKER_RUNTIME_BASE_CACHE}" \
            -f apps/validation-worker/Dockerfile \
            -t "${VALIDATION_WORKER_RUNTIME_BASE_IMAGE}" \
            --push \
            .

      - name: Build and push validation worker image
        run: |
          WORKER_IMAGE="${VALIDATION_WORKER_IMAGE}"
          WORKER_CACHE="${WORKER_IMAGE}:buildcache"
          runtime_base_args=()
          if [[ "${VALIDATION_WORKER_USE_RUNTIME_BASE}" == "true" ]]; then
            runtime_base_args+=(--build-arg "VALIDATION_WORKER_RUNTIME_BASE=${VALIDATION_WORKER_RUNTIME_BASE_IMAGE}")
            echo "Using prebuilt validation worker runtime base: ${VALIDATION_WORKER_RUNTIME_BASE_IMAGE}"
          else
            echo "Building validation worker runtime base inside this image build."
          fi

          docker buildx build \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${WORKER_CACHE}" \
            -f apps/validation-worker/Dockerfile \
            "${runtime_base_args[@]}" \
            --build-arg BUILD_GIT_REF="${GITHUB_REF_NAME}" \
            --build-arg BUILD_GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_IMAGE_TAG="${GITHUB_SHA}" \
            --build-arg BUILD_RUNTIME_TARGET="ecs-fargate" \
            -t "${WORKER_IMAGE}:${GITHUB_SHA}" \
            -t "${WORKER_IMAGE}:latest" \
            --push \
            .

      - name: Register validation worker task definition
        run: |
          current_task_definition="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER_NAME}" \
              --services "${ECS_WORKER_SERVICE_NAME}" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          aws ecs describe-task-definition --task-definition "${current_task_definition}" \
            | jq '.taskDefinition
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
              | .cpu = env.ECS_WORKER_CPU
              | .memory = env.ECS_WORKER_MEMORY
              | .containerDefinitions = (.containerDefinitions | map(
                  if .name == env.ECS_WORKER_CONTAINER_NAME
                  then .image = "\(env.VALIDATION_WORKER_IMAGE):\(env.GITHUB_SHA)"
                    | del(.command)
                    | .secrets = (
                        (.secrets // [])
                        | map(select(
                            .name != "S3_ACCESS_KEY_ID"
                            and .name != "S3_SECRET_ACCESS_KEY"
                          ))
                      )
                    | .environment = (
                        (.environment // [])
                        | map(select(
                            .name != "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_ENABLED"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_SECONDS"
                            and .name != "CERTSCORE_REVIEW_MODEL"
                            and .name != "CERTSCORE_ROUTINE_REVIEW_MODEL"
                            and .name != "CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED"
                            and .name != "CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED"
                            and .name != "CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED"
                            and .name != "CERTSCORE_MINI_REVIEW_ENABLED"
                            and .name != "CERTSCORE_MODEL_REVIEW_MODE"
                            and .name != "CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED"
                            and .name != "CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED"
                          ))
                        + [
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_ENABLED",
                              "value": env.VALIDATION_WORKER_LAMBDA_RESULT_POLL_ENABLED
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_SECONDS",
                              "value": env.VALIDATION_WORKER_LAMBDA_RESULT_POLL_SECONDS
                            },
                            {
                              "name": "CERTSCORE_REVIEW_MODEL",
                              "value": env.CERTSCORE_REVIEW_MODEL
                            },
                            {
                              "name": "CERTSCORE_ROUTINE_REVIEW_MODEL",
                              "value": env.CERTSCORE_ROUTINE_REVIEW_MODEL
                            },
                            {
                              "name": "CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED",
                              "value": env.CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED",
                              "value": env.CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED",
                              "value": env.CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_MINI_REVIEW_ENABLED",
                              "value": env.CERTSCORE_MINI_REVIEW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_MODEL_REVIEW_MODE",
                              "value": env.CERTSCORE_MODEL_REVIEW_MODE
                            },
                            {
                              "name": "CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED",
                              "value": env.CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED",
                              "value": env.CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED
                            }
                          ]
                      )
                  else .
                  end
                ))' > /tmp/validation-worker-task-definition.json

          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/validation-worker-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "VALIDATION_WORKER_TASK_DEFINITION_ARN=${task_definition_arn}" >> "${GITHUB_ENV}"
          echo "Registered ${task_definition_arn}"

      - name: Force ECS deployments
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_WORKER_SERVICE_NAME}" \
            --task-definition "${VALIDATION_WORKER_TASK_DEFINITION_ARN}" \
            --force-new-deployment >/dev/null

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable --cluster "${ECS_CLUSTER_NAME}" --services "${ECS_WORKER_SERVICE_NAME}"

      - name: Check validation worker ECS boot
        if: ${{ env.ECS_WORKER_LOG_GROUP != '' }}
        env:
          ECS_CLUSTER_NAME: ${{ env.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ env.ECS_WORKER_SERVICE_NAME }}
          ECS_CONTAINER_NAME: ${{ env.ECS_WORKER_CONTAINER_NAME }}
          ECR_REPOSITORY: ${{ env.ECR_WORKER_REPOSITORY }}
          ECS_LOG_GROUP: ${{ env.ECS_WORKER_LOG_GROUP }}
          CHECK_NAME: validation-worker
          EXPECTED_GIT_SHA: ${{ github.sha }}
          ECS_HEALTH_REQUIRE_LOG_HEARTBEAT: "0"
          ECS_HEALTH_LOG_PATTERN: validation-worker.*started|validation-worker.*heartbeat|heartbeat
        run: pnpm ops:check:ecs-service-deploy

      - name: Skip validation worker ECS boot check
        if: ${{ env.ECS_WORKER_LOG_GROUP == '' }}
        run: |
          echo "Skipping validation worker ECS boot check because AWS_VALIDATION_ECS_WORKER_LOG_GROUP is not configured."
          echo "Set AWS_VALIDATION_ECS_WORKER_LOG_GROUP to enable post-deploy heartbeat/log validation."
