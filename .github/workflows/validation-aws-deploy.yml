name: Validation AWS Deploy
run-name: ${{ inputs.stage_only && format('Stage validation {0}', github.sha) || inputs.staged_run_id != '' && format('Promote validation {0} from {1} {2}', github.sha, inputs.staged_run_id, inputs.staged_image) || github.event_name == 'push' && vars.AWS_STAGED_COUPLED_RELEASES == 'true' && format('Verify validation {0}', github.sha) || format('Deploy validation {0}', github.sha) }}

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/validation-aws-deploy.yml"
      - "apps/validation-worker/**"
      - "apps/web/lib/scans/**"
      - "apps/web/server/**"
      - "apps/web/package.json"
      - "infra/aws/validation/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/validation-shared/**"
      - "packages/web-bot-auth/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "patches/**"
      - "tsconfig.base.json"
      - "turbo.json"
      - "scripts/select-workflow-deployment.mjs"
      - "scripts/lib/deployment-inputs.mjs"
      - "scripts/lib/deployed-image.mjs"
      - "scripts/runtime-base-changes.mjs"
      - "scripts/validation-worker-ecs-healthcheck.json"
      - "scripts/lib/runtime-base-inputs.mjs"
      - "scripts/docker-source-policy.json"
      - "scripts/build-with-pinned-node-fallback.mjs"
      - "scripts/build-with-pinned-node-fallback.test.mjs"
      - "!apps/validation-worker/**/*.test.ts"
      - "!apps/validation-worker/**/*.spec.ts"
      - "!apps/validation-worker/scripts/**"
      - "!apps/web/**/*.test.ts"
      - "!apps/web/**/*.test.tsx"
      - "!apps/web/**/*.spec.ts"
      - "!apps/web/**/*.spec.tsx"
  workflow_dispatch:
    inputs:
      stage_only:
        description: Verify and stage the exact validation worker image in ECR
        type: boolean
        default: false
      staged_run_id:
        description: Successful validation staging run ID
        type: string
        default: ''
      staged_image:
        description: Approved staging attempt and SHA-256 digest
        type: string
        default: ''
      expected_sha:
        description: Exact target for an approved staged coupled release
        type: string
        default: ''
      use_runtime_base:
        description: "Use the prebuilt validation worker runtime base image."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      push_runtime_base:
        description: "Build and push the validation worker runtime base before the app image."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      runtime_base_tag:
        description: "Validation worker runtime base tag to use or publish."
        required: false
        default: "validation-worker-runtime-base"

concurrency:
  group: validation-aws-production
  cancel-in-progress: false

jobs:
  deploy-validation-aws:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      STAGE_ONLY: ${{ inputs.stage_only }}
      STAGED_RUN_ID: ${{ inputs.staged_run_id }}
      STAGED_IMAGE: ${{ inputs.staged_image }}
      EXPERIMENTAL_BUILDKIT_SOURCE_POLICY: ${{ github.workspace }}/scripts/docker-source-policy.json
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_VALIDATION_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
      ECR_WORKER_REPOSITORY: ${{ vars.AWS_VALIDATION_WORKER_ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.AWS_VALIDATION_ECS_CLUSTER }}
      ECS_WORKER_SERVICE_NAME: ${{ vars.AWS_VALIDATION_ECS_WORKER_SERVICE }}
      ECS_WORKER_CONTAINER_NAME: ${{ vars.AWS_VALIDATION_ECS_WORKER_CONTAINER || 'validation-worker' }}
      ECS_WORKER_LOG_GROUP: ${{ vars.AWS_VALIDATION_ECS_WORKER_LOG_GROUP }}
      ECS_WORKER_CPU: "256"
      ECS_WORKER_MEMORY: "512"
      VALIDATION_WORKER_USE_RUNTIME_BASE: ${{ github.event.inputs.use_runtime_base || vars.VALIDATION_WORKER_USE_RUNTIME_BASE || 'true' }}
      VALIDATION_WORKER_PUSH_RUNTIME_BASE: ${{ github.event.inputs.push_runtime_base || vars.VALIDATION_WORKER_PUSH_RUNTIME_BASE || 'false' }}
      VALIDATION_WORKER_RUNTIME_BASE_TAG: ${{ github.event.inputs.runtime_base_tag || vars.VALIDATION_WORKER_RUNTIME_BASE_TAG || 'validation-worker-runtime-base' }}
      VALIDATION_WORKER_RUNTIME_BASE_CACHE_TAG: ${{ vars.VALIDATION_WORKER_RUNTIME_BASE_CACHE_TAG || 'validation-worker-runtime-base-cache' }}
      VALIDATION_WORKER_LAMBDA_RESULT_POLL_ENABLED: "1"
      VALIDATION_WORKER_LAMBDA_RESULT_POLL_SECONDS: "2"
      VALIDATION_WORKER_LAMBDA_DISPATCH_PUBLISH_ENABLED: "1"
      VALIDATION_WORKER_LAMBDA_DISPATCH_PUBLISH_SECONDS: "1"
      CERTSCORE_REVIEW_MODEL: ${{ vars.CERTSCORE_REVIEW_MODEL || 'gpt-5.4-mini' }}
      CERTSCORE_ROUTINE_REVIEW_MODEL: ${{ vars.CERTSCORE_ROUTINE_REVIEW_MODEL || 'gpt-5.4-nano' }}
      CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED: ${{ vars.CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED || '0' }}
      CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED: ${{ vars.CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED || '0' }}
      CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED: ${{ vars.CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED || '0' }}
      CERTSCORE_MINI_REVIEW_ENABLED: "1"
      CERTSCORE_MINI_EXCEPTION_ROUTING_ENABLED: ${{ vars.CERTSCORE_MINI_EXCEPTION_ROUTING_ENABLED || '0' }}
      CERTSCORE_RUNTIME_SEMANTIC_CACHE_ENABLED: ${{ vars.CERTSCORE_RUNTIME_SEMANTIC_CACHE_ENABLED || '0' }}
      CERTSCORE_MODEL_REVIEW_MODE: "enforced"
      CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED: "1"
      CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED: "1"

    steps:
      - name: Verify requested staged revision
        if: inputs.expected_sha != '' || inputs.stage_only || inputs.staged_run_id != '' || inputs.staged_image != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_ENABLED: ${{ vars.AWS_STAGED_COUPLED_RELEASES }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          if [[ "$STAGE_ONLY" == true || -n "$STAGED_RUN_ID" || -n "$STAGED_IMAGE" ]]; then
            test "$STAGING_ENABLED" = true || exit 1
            test "$GITHUB_EVENT_NAME" = workflow_dispatch || exit 1
            test "$VALIDATION_WORKER_USE_RUNTIME_BASE" = true || exit 1
            test "$VALIDATION_WORKER_PUSH_RUNTIME_BASE" = false || exit 1
            test "$VALIDATION_WORKER_RUNTIME_BASE_TAG" = validation-worker-runtime-base || exit 1
            if [[ "$STAGE_ONLY" == true ]]; then
              [[ -z "$STAGED_RUN_ID" && -z "$STAGED_IMAGE" ]] || exit 1
            else
              [[ "$STAGED_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
              [[ "$STAGED_IMAGE" =~ ^[1-9][0-9]{0,5}:sha256:[0-9a-f]{64}$ ]] || exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report deploy-triggering changes
        if: inputs.staged_run_id == ''
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${{ github.event.before }}" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          echo "Deploy trigger: validation worker"
          echo "Base ref: ${base_ref}"
          echo "Head ref: ${GITHUB_SHA}"
          echo
          echo "Changed files considered by this deploy:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | sed 's/^/  - /'
          echo
          echo "Deploy categories:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | awk '
            /^apps\/validation-worker\// { worker=1 }
            /^apps\/validation-worker\/scripts\// { worker_scripts=1 }
            /^apps\/validation-worker\/.*\.(test|spec)\.ts$/ { worker_tests=1 }
            /^apps\/web\/lib\/scans\// || /^apps\/web\/server\// { surfacing=1 }
            /^apps\/web\/.*\.(test|spec)\.(ts|tsx)$/ { web_tests=1 }
            /^packages\/(shared|db|validation-shared|web-bot-auth)\// { pkg=1 }
            /^infra\/aws\/validation\// { infra=1 }
            /^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json|\.dockerignore)$/ { build=1 }
            /^\.github\/workflows\/validation-aws-deploy\.yml$/ { workflow=1 }
            END {
              if (worker) print "  - validation worker source"
              if (worker_scripts) print "  - validation worker script-only change"
              if (worker_tests) print "  - validation worker test-only change"
              if (surfacing) print "  - web server/scan dependency compiled into validation runtime"
              if (web_tests) print "  - web scan/finding test-only change"
              if (pkg) print "  - validation runtime package"
              if (infra) print "  - validation infrastructure"
              if (build) print "  - build/dependency config"
              if (workflow) print "  - deploy workflow"
            }
          '

          runtime_inputs_changed="$(node scripts/runtime-base-changes.mjs validation "${base_ref}" "${GITHUB_SHA}")"
          {
            echo "VALIDATION_DEPLOY_BASE_REF=${base_ref}"
            # Root package.json script-only edits do not change the Chromium/runtime
            # base. Dependency changes remain covered by the canonical lockfile.
            echo "VALIDATION_RUNTIME_INPUTS_CHANGED=${runtime_inputs_changed}"
          } >> "${GITHUB_ENV}"

      - name: Validate deploy configuration
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || (echo "Missing secret AWS_ROLE_TO_ASSUME" && exit 1)
          test -n "${ECR_WORKER_REPOSITORY}" || (echo "Missing var AWS_VALIDATION_WORKER_ECR_REPOSITORY" && exit 1)
          test -n "${ECS_CLUSTER_NAME}" || (echo "Missing var AWS_VALIDATION_ECS_CLUSTER" && exit 1)
          test -n "${ECS_WORKER_SERVICE_NAME}" || (echo "Missing var AWS_VALIDATION_ECS_WORKER_SERVICE" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          inline-session-policy: >-
            ${{ inputs.stage_only && '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ecr:GetAuthorizationToken","ecr:DescribeImages","ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability","ecr:InitiateLayerUpload","ecr:UploadLayerPart","ecr:CompleteLayerUpload","ecr:PutImage"],"Resource":"*"}]}' || '' }}

      - name: Login to Amazon ECR
        if: inputs.staged_run_id == ''
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: inputs.staged_run_id == ''
        uses: docker/setup-buildx-action@v3

      - name: Setup pnpm
        if: inputs.staged_run_id == ''
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ inputs.staged_run_id == '' && 'pnpm' || '' }}

      - name: Install dependencies
        if: inputs.staged_run_id == ''
        run: pnpm install --frozen-lockfile

      - name: Bootstrap workspace exports before dependent verification
        if: inputs.staged_run_id == ''
        run: node scripts/release-node.mjs scripts/bootstrap-release.ts

      - name: Install Chromium for form lifecycle release check
        if: inputs.staged_run_id == ''
        run: pnpm --filter @certscore/scan-core exec playwright install --with-deps chromium

      - name: Verify post-Accept forms and images reach the report
        if: inputs.staged_run_id == ''
        run: pnpm test:post-accept-forms


      - name: Typecheck validation worker
        if: inputs.staged_run_id == ''
        run: |
          pnpm --filter @website-signal-risk-scanner/validation-worker typecheck

      - name: Run validation pipeline tests
        if: inputs.staged_run_id == ''
        run: pnpm test:scan-pipeline

      - name: Select deployment from installed validation runtime inputs
        id: runtime-selection
        env:
          ECS_SERVICE_NAME: ${{ env.ECS_WORKER_SERVICE_NAME }}
          ECS_CONTAINER_NAME: ${{ env.ECS_WORKER_CONTAINER_NAME }}
          HOLD_AUTOMATIC_PROMOTION: ${{ github.event_name == 'push' && vars.AWS_STAGED_COUPLED_RELEASES == 'true' }}
        run: |
          if [[ -n "$STAGED_RUN_ID" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HOLD_AUTOMATIC_PROMOTION" == true ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/select-workflow-deployment.mjs validation
          fi

      - name: Resolve validation worker runtime base mode
        if: steps.runtime-selection.outputs.deploy == 'true' && inputs.staged_run_id == ''
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          WORKER_IMAGE="${REGISTRY}/${ECR_WORKER_REPOSITORY}"
          WORKER_RUNTIME_BASE_IMAGE="${WORKER_IMAGE}:${VALIDATION_WORKER_RUNTIME_BASE_TAG}"
          WORKER_RUNTIME_BASE_CACHE="${WORKER_IMAGE}:${VALIDATION_WORKER_RUNTIME_BASE_CACHE_TAG}"

          echo "VALIDATION_WORKER_IMAGE=${WORKER_IMAGE}" >> "${GITHUB_ENV}"
          echo "VALIDATION_WORKER_RUNTIME_BASE_IMAGE=${WORKER_RUNTIME_BASE_IMAGE}" >> "${GITHUB_ENV}"
          echo "VALIDATION_WORKER_RUNTIME_BASE_CACHE=${WORKER_RUNTIME_BASE_CACHE}" >> "${GITHUB_ENV}"

          echo "Validation worker runtime base mode:"
          echo "  use_runtime_base=${VALIDATION_WORKER_USE_RUNTIME_BASE}"
          echo "  push_runtime_base=${VALIDATION_WORKER_PUSH_RUNTIME_BASE}"
          echo "  runtime_base_image=${WORKER_RUNTIME_BASE_IMAGE}"
          echo "  runtime_inputs_changed=${VALIDATION_RUNTIME_INPUTS_CHANGED:-unknown}"

          if [[ "${VALIDATION_WORKER_USE_RUNTIME_BASE}" != "true" && "${VALIDATION_WORKER_USE_RUNTIME_BASE}" != "false" ]]; then
            echo "VALIDATION_WORKER_USE_RUNTIME_BASE must be true or false."
            exit 1
          fi
          if [[ "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "true" && "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "false" ]]; then
            echo "VALIDATION_WORKER_PUSH_RUNTIME_BASE must be true or false."
            exit 1
          fi

          if [[ "${VALIDATION_WORKER_USE_RUNTIME_BASE}" == "true" && "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "true" ]]; then
            if ! docker buildx imagetools inspect "${WORKER_RUNTIME_BASE_IMAGE}" >/dev/null 2>&1; then
              echo "Missing validation worker runtime base image: ${WORKER_RUNTIME_BASE_IMAGE}"
              echo "Bootstrap it with workflow_dispatch push_runtime_base=true, or set VALIDATION_WORKER_USE_RUNTIME_BASE=false for a one-off full image build."
              exit 1
            fi
          fi

          if [[ "${VALIDATION_RUNTIME_INPUTS_CHANGED:-0}" == "1" && "${VALIDATION_WORKER_USE_RUNTIME_BASE}" == "true" && "${VALIDATION_WORKER_PUSH_RUNTIME_BASE}" != "true" ]]; then
            echo "Validation worker runtime inputs changed, but push_runtime_base is false."
            echo "Re-run with workflow_dispatch push_runtime_base=true so Playwright/Chromium/runtime dependencies are rebuilt intentionally."
            exit 1
          fi

      - name: Test pinned image-source recovery
        if: steps.runtime-selection.outputs.deploy == 'true' && inputs.staged_run_id == ''
        run: node --test scripts/build-with-pinned-node-fallback.test.mjs

      - name: Build and push validation worker runtime base
        if: ${{ steps.runtime-selection.outputs.deploy == 'true' && inputs.staged_run_id == '' && !inputs.stage_only && (env.VALIDATION_WORKER_PUSH_RUNTIME_BASE == 'true') }}
        run: |
          node scripts/build-with-pinned-node-fallback.mjs -- docker buildx build \
            --provenance=false \
            --sbom=false \
            --target validation-worker-runtime-base \
            --cache-from "type=registry,ref=${VALIDATION_WORKER_RUNTIME_BASE_CACHE}" \
            -f apps/validation-worker/Dockerfile \
            -t "${VALIDATION_WORKER_RUNTIME_BASE_IMAGE}" \
            --push \
            .

      - name: Build and push validation worker image
        if: steps.runtime-selection.outputs.deploy == 'true' && inputs.staged_run_id == ''
        run: |
          WORKER_IMAGE="${VALIDATION_WORKER_IMAGE}"
          WORKER_CACHE="${WORKER_IMAGE}:buildcache"
          runtime_base_args=()
          if [[ "${VALIDATION_WORKER_USE_RUNTIME_BASE}" == "true" ]]; then
            runtime_base_args+=(--build-arg "VALIDATION_WORKER_RUNTIME_BASE=${VALIDATION_WORKER_RUNTIME_BASE_IMAGE}")
            echo "Using prebuilt validation worker runtime base: ${VALIDATION_WORKER_RUNTIME_BASE_IMAGE}"
          else
            echo "Building validation worker runtime base inside this image build."
          fi

          tags=(-t "${WORKER_IMAGE}:${GITHUB_SHA}")
          if [[ "$STAGE_ONLY" != true ]]; then tags+=(-t "${WORKER_IMAGE}:latest"); fi
          node scripts/build-with-pinned-node-fallback.mjs -- docker buildx build \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${WORKER_CACHE}" \
            --cache-to "type=registry,ref=${WORKER_CACHE},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            -f apps/validation-worker/Dockerfile \
            "${runtime_base_args[@]}" \
            --build-arg BUILD_GIT_REF="${GITHUB_REF_NAME}" \
            --build-arg BUILD_GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_IMAGE_TAG="${GITHUB_SHA}" \
            --build-arg BUILD_RUNTIME_TARGET="ecs-fargate" \
            --metadata-file "$RUNNER_TEMP/validation-build-metadata.json" \
            "${tags[@]}" \
            --push \
            .

          echo "TARGET_VALIDATION_IMAGE=${WORKER_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          if [[ "$STAGE_ONLY" == true ]]; then
            digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/validation-build-metadata.json")
            jq -n --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg repo "$WORKER_IMAGE" --arg digest "$digest" \
              '{version:1,sha:$sha,typecheckedSha:$sha,runId:$runId,attempt:$attempt,repository:$repo,digest:$digest}' > "$RUNNER_TEMP/staged-validation.json"
          fi

      - name: Publish staged validation image receipt
        if: inputs.stage_only
        uses: actions/upload-artifact@v4
        with:
          name: staged-validation-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-validation.json
          retention-days: 1
          if-no-files-found: error

      - name: Verify and select staged validation image
        if: inputs.staged_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote --exit-code origin refs/heads/main)" = "$GITHUB_SHA"$'\t'refs/heads/main
          image=$(node scripts/resolve-staged-ecs-image.mjs validation "$ECR_WORKER_REPOSITORY")
          echo "TARGET_VALIDATION_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Register validation worker task definition
        if: steps.runtime-selection.outputs.deploy == 'true' && !inputs.stage_only
        run: |
          test -n "$TARGET_VALIDATION_IMAGE"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          export VALIDATION_WORKER_LAMBDA_EU_DE_DISPATCH_QUEUE_URL="https://sqs.eu-central-1.amazonaws.com/${account_id}/certscore-v2-dag-local-production-dispatch.fifo"
          export VALIDATION_WORKER_LAMBDA_EU_IE_DISPATCH_QUEUE_URL="https://sqs.eu-west-1.amazonaws.com/${account_id}/certscore-v2-dag-local-production-dispatch.fifo"
          export VALIDATION_WORKER_LAMBDA_US_WEST_DISPATCH_QUEUE_URL="https://sqs.us-west-1.amazonaws.com/${account_id}/certscore-v2-dag-local-production-dispatch.fifo"

          current_task_definition="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER_NAME}" \
              --services "${ECS_WORKER_SERVICE_NAME}" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          aws ecs describe-task-definition --task-definition "${current_task_definition}" \
            | jq --slurpfile healthcheck scripts/validation-worker-ecs-healthcheck.json '.taskDefinition
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
              | .cpu = env.ECS_WORKER_CPU
              | .memory = env.ECS_WORKER_MEMORY
              | .containerDefinitions = (.containerDefinitions | map(
                  if .name == env.ECS_WORKER_CONTAINER_NAME
                  then .image = env.TARGET_VALIDATION_IMAGE
                    | .healthCheck = $healthcheck[0]
                    | .dockerLabels = ((.dockerLabels // {}) + {"org.opencontainers.image.revision":env.GITHUB_SHA})
                    | del(.command)
                    | .secrets = (
                        (.secrets // [])
                        | map(select(
                            .name != "S3_ACCESS_KEY_ID"
                            and .name != "S3_SECRET_ACCESS_KEY"
                          ))
                      )
                    | .environment = (
                        (.environment // [])
                        | map(select(
                            .name != "CERTSCORE_FULL_SITE_INTERNAL_ENABLED"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_ENABLED"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_SECONDS"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_DISPATCH_PUBLISH_ENABLED"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_DISPATCH_PUBLISH_SECONDS"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_EU_DE_DISPATCH_QUEUE_URL"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_EU_IE_DISPATCH_QUEUE_URL"
                            and .name != "CERTSCORE_V2_DAG_LAMBDA_US_WEST_DISPATCH_QUEUE_URL"
                            and .name != "CERTSCORE_REVIEW_MODEL"
                            and .name != "CERTSCORE_ROUTINE_REVIEW_MODEL"
                            and .name != "CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED"
                            and .name != "CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED"
                            and .name != "CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED"
                            and .name != "CERTSCORE_MINI_REVIEW_ENABLED"
                            and .name != "CERTSCORE_MINI_EXCEPTION_ROUTING_ENABLED"
                            and .name != "CERTSCORE_RUNTIME_SEMANTIC_CACHE_ENABLED"
                            and .name != "CERTSCORE_MODEL_REVIEW_MODE"
                            and .name != "CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED"
                            and .name != "CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED"
                          ))
                        + [
                            {"name": "CERTSCORE_FULL_SITE_INTERNAL_ENABLED", "value": "1"},
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_ENABLED",
                              "value": env.VALIDATION_WORKER_LAMBDA_RESULT_POLL_ENABLED
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_RESULT_POLL_SECONDS",
                              "value": env.VALIDATION_WORKER_LAMBDA_RESULT_POLL_SECONDS
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_DISPATCH_PUBLISH_ENABLED",
                              "value": env.VALIDATION_WORKER_LAMBDA_DISPATCH_PUBLISH_ENABLED
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_DISPATCH_PUBLISH_SECONDS",
                              "value": env.VALIDATION_WORKER_LAMBDA_DISPATCH_PUBLISH_SECONDS
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_EU_DE_DISPATCH_QUEUE_URL",
                              "value": env.VALIDATION_WORKER_LAMBDA_EU_DE_DISPATCH_QUEUE_URL
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_EU_IE_DISPATCH_QUEUE_URL",
                              "value": env.VALIDATION_WORKER_LAMBDA_EU_IE_DISPATCH_QUEUE_URL
                            },
                            {
                              "name": "CERTSCORE_V2_DAG_LAMBDA_US_WEST_DISPATCH_QUEUE_URL",
                              "value": env.VALIDATION_WORKER_LAMBDA_US_WEST_DISPATCH_QUEUE_URL
                            },
                            {
                              "name": "CERTSCORE_REVIEW_MODEL",
                              "value": env.CERTSCORE_REVIEW_MODEL
                            },
                            {
                              "name": "CERTSCORE_ROUTINE_REVIEW_MODEL",
                              "value": env.CERTSCORE_ROUTINE_REVIEW_MODEL
                            },
                            {
                              "name": "CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED",
                              "value": env.CERTSCORE_ROUTINE_REVIEW_SHADOW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED",
                              "value": env.CERTSCORE_EXTRACTION_REUSE_SHADOW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED",
                              "value": env.CERTSCORE_DUAL_NANO_CONSENSUS_SHADOW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_MINI_REVIEW_ENABLED",
                              "value": env.CERTSCORE_MINI_REVIEW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_MINI_EXCEPTION_ROUTING_ENABLED",
                              "value": env.CERTSCORE_MINI_EXCEPTION_ROUTING_ENABLED
                            },
                            {
                              "name": "CERTSCORE_RUNTIME_SEMANTIC_CACHE_ENABLED",
                              "value": env.CERTSCORE_RUNTIME_SEMANTIC_CACHE_ENABLED
                            },
                            {
                              "name": "CERTSCORE_MODEL_REVIEW_MODE",
                              "value": env.CERTSCORE_MODEL_REVIEW_MODE
                            },
                            {
                              "name": "CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED",
                              "value": env.CERTSCORE_PARALLEL_POLICY_REVIEW_ENABLED
                            },
                            {
                              "name": "CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED",
                              "value": env.CERTSCORE_PARALLEL_POLICY_PROJECTION_ENABLED
                            }
                          ]
                      )
                  else .
                  end
                ))' > /tmp/validation-worker-task-definition.json

          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/validation-worker-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "VALIDATION_WORKER_TASK_DEFINITION_ARN=${task_definition_arn}" >> "${GITHUB_ENV}"
          echo "Registered ${task_definition_arn}"

      - name: Force ECS deployments
        id: worker-rollout
        if: steps.runtime-selection.outputs.deploy == 'true' && !inputs.stage_only
        run: |
          # A diagnostic read must not block the rollout if ECS telemetry is unavailable.
          if previous_tasks=$(timeout 5s aws ecs list-tasks \
            --cluster "$ECS_CLUSTER_NAME" --service-name "$ECS_WORKER_SERVICE_NAME" \
            --desired-status RUNNING --max-items 100 --output json \
            | jq -ce '.taskArns | select(type == "array")'); then
            echo "VALIDATION_PREVIOUS_TASKS=$previous_tasks" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not snapshot the previous validation tasks for rollout timing."
          fi

          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_WORKER_SERVICE_NAME}" \
            --task-definition "${VALIDATION_WORKER_TASK_DEFINITION_ARN}" \
            --force-new-deployment \
            --query 'service.deployments[?status==`PRIMARY`].{id:id,createdAt:createdAt}' \
            --output json

      - name: Wait for ECS services to stabilize
        if: steps.runtime-selection.outputs.deploy == 'true' && !inputs.stage_only
        run: |
          if [[ -z "$STAGED_RUN_ID" ]]; then
            aws ecs wait services-stable --cluster "${ECS_CLUSTER_NAME}" --services "${ECS_WORKER_SERVICE_NAME}"
          else
            node scripts/wait-for-staged-ecs.mjs "$ECS_CLUSTER_NAME" "$ECS_WORKER_SERVICE_NAME" "$VALIDATION_WORKER_TASK_DEFINITION_ARN"
          fi

      - name: Check validation worker ECS boot
        if: ${{ steps.runtime-selection.outputs.deploy == 'true' && !inputs.stage_only && (env.ECS_WORKER_LOG_GROUP != '') }}
        env:
          ECS_CLUSTER_NAME: ${{ env.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ env.ECS_WORKER_SERVICE_NAME }}
          ECS_CONTAINER_NAME: ${{ env.ECS_WORKER_CONTAINER_NAME }}
          ECR_REPOSITORY: ${{ env.ECR_WORKER_REPOSITORY }}
          ECS_LOG_GROUP: ${{ env.ECS_WORKER_LOG_GROUP }}
          CHECK_NAME: validation-worker
          EXPECTED_GIT_SHA: ${{ github.sha }}
          ECS_HEALTH_REQUIRE_LOG_HEARTBEAT: "0"
          ECS_HEALTH_LOG_PATTERN: validation-worker.*started|validation-worker.*heartbeat|heartbeat
        run: |
          if [[ -z "$STAGED_RUN_ID" ]]; then
            pnpm ops:check:ecs-service-deploy
          else
            bash scripts/check-ecs-service-deploy-health.sh
          fi

      - name: Skip validation worker ECS boot check
        if: ${{ steps.runtime-selection.outputs.deploy == 'true' && !inputs.stage_only && (env.ECS_WORKER_LOG_GROUP == '') }}
        run: |
          echo "Skipping validation worker ECS boot check because AWS_VALIDATION_ECS_WORKER_LOG_GROUP is not configured."
          echo "Set AWS_VALIDATION_ECS_WORKER_LOG_GROUP to enable post-deploy heartbeat/log validation."

      - name: Report previous validation task stop timing
        if: ${{ !cancelled() && steps.worker-rollout.outcome == 'success' && env.VALIDATION_PREVIOUS_TASKS != '' && env.VALIDATION_PREVIOUS_TASKS != '[]' }}
        run: |
          mapfile -t previous_tasks < <(jq -r '.[]' <<< "$VALIDATION_PREVIOUS_TASKS")
          if ! timeout 5s aws ecs describe-tasks --cluster "$ECS_CLUSTER_NAME" --tasks "${previous_tasks[@]}" --output json \
            | jq -ce '{previousTasks: [.tasks[] | {taskArn, taskDefinitionArn, lastStatus, stoppingAt, executionStoppedAt, stoppedAt}],
                unavailableTasks: [.failures[]? | {arn, reason}]}'; then
            echo "::warning::Could not read stop timing for the previous validation tasks."
          fi
