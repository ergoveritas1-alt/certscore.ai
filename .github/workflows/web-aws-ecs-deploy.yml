name: Public Web AWS ECS Deploy
run-name: ${{ inputs.stage_only && format('Stage public web {0}', github.sha) || inputs.staged_run_id != '' && format('Promote public web {0} from {1} {2}', github.sha, inputs.staged_run_id, inputs.staged_image) || github.event_name == 'push' && vars.AWS_STAGED_COUPLED_RELEASES == 'true' && format('Verify public web {0}', github.sha) || format('Deploy public web {0}', github.sha) }}

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/web-aws-ecs-deploy.yml"
      - "scripts/select-workflow-deployment.mjs"
      - "scripts/lib/deployment-inputs.mjs"
      - "scripts/lib/deployed-image.mjs"
      - "apps/web/**"
      - "packages/certscore-contracts/**"
      - "packages/certscore-vendor-resolver/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/validation-shared/**"
      - "scripts/apply-db-migrations.mjs"
      - "scripts/wait-for-ecs-migration.mjs"
      - "scripts/assert-forward-web-deploy.ts"
      - "scripts/runtime-base-changes.mjs"
      - "scripts/lib/runtime-base-inputs.mjs"
      - "scripts/docker-source-policy.json"
      - "scripts/configure-marketplace-light.ts"
      - "scripts/configure-marketplace-browser.ts"
      - "scripts/insert-integration-api-key.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "patches/**"
      - "tsconfig.base.json"
      - "turbo.json"
      - "!apps/web/**/*.test.ts"
      - "!apps/web/**/*.test.tsx"
      - "!apps/web/**/*.spec.ts"
      - "!apps/web/**/*.spec.tsx"
      - "!apps/web/scripts/**"
  workflow_dispatch:
    inputs:
      stage_only:
        description: Verify and stage the exact main image in ECR
        type: boolean
        default: false
      staged_run_id:
        description: Successful staging run ID to promote by digest
        type: string
        default: ''
      staged_image:
        description: Approved staging attempt and SHA-256 digest
        type: string
        default: ''
      staged_base_sha:
        description: Live web SHA used to prepare the approved release
        type: string
        default: ''
      use_compiler_cache:
        description: "Opt-in benchmark only: restore/save bounded compiler cache (local app timings did not demonstrate a material speedup)."
        required: false
        default: false
        type: boolean
      push_runtime_base:
        description: "Rebuild the web runtime base intentionally (otherwise dependency changes or missing base only)."
        required: false
        default: false
        type: boolean
      marketplace_browser:
        description: Browser Marketplace onboarding and new scans (lifecycle remains active)
        required: false
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      marketplace_light:
        description: "Marketplace Light API-key access (owner-approved integration)"
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      allow_non_descendant_deploy:
        description: "Emergency only: permit a web revision that does not contain the currently live revision"
        required: false
        default: false
        type: boolean
      use_x64_fallback:
        description: "Emergency only: build ARM64 through x64 emulation instead of the native ARM64 runner"
        required: false
        default: false
        type: boolean

concurrency:
  group: public-web-aws-production
  cancel-in-progress: false

jobs:
  verify-public-web:
    if: inputs.staged_run_id == ''
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_x64_fallback && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verified_sha: ${{ steps.web-typecheck.outputs.verified_sha }}
      deploy: ${{ steps.runtime-selection.outputs.deploy }}
    env:
      CERTSCORE_BASE_URL: ${{ vars.AWS_WEB_CERTSCORE_BASE_URL }}
    services:
      marketplace-test-db:
        image: public.ecr.aws/docker/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: marketplace_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scan-source test dependencies
        run: node scripts/release-node.mjs scripts/bootstrap-release.ts

      - name: Test scan-source contracts
        run: |
          pnpm exec tsx --tsconfig apps/web/tsconfig.test.json --test \
            apps/web/components/marketing/domain-scan-form.test.ts \
            apps/web/components/scans/scan-from-select.test.tsx \
            apps/web/server/scans/recent-scan-reuse.test.ts \
            apps/web/server/scans/restricted-scan-options.test.ts \
            scripts/assert-forward-web-deploy.test.ts \
            scripts/deploy-latency.test.ts \
            scripts/web-deploy-migration-order.test.ts \
            scripts/web-deployment-skew-protection.test.ts

      - name: Test reviewed assessment highlights
        run: pnpm test:assessment-highlights

      - name: Test canonical scan no-go reports
        run: pnpm test:scan-no-go

      - name: Test canonical accessibility scoring
        run: |
          pnpm exec tsx --tsconfig apps/web/tsconfig.test.json --test \
            apps/web/lib/scans/accessibility-score-policy.test.ts \
            apps/web/lib/scans/scoring-policy.test.ts \
            apps/web/server/scans/accessibility-audit-projection.test.ts \
            apps/web/server/scans/persisted-canonical-report-projection.test.ts \
            apps/web/server/scans/full-site-score.test.ts \
            apps/web/lib/api-v2/scan-report-summary.test.ts

      - name: Test report publication ownership and artifact transfer
        env:
          CERTSCORE_PUBLICATION_TEST_ADMIN_URL: postgresql://postgres:local-fixture-only@127.0.0.1:5432/postgres
        run: |
          pnpm exec tsx --tsconfig apps/web/tsconfig.test.json --test \
            apps/web/server/scans/canonical-scan-report-publisher.test.ts \
            apps/web/server/scans/score-materialization-failure.test.ts \
            apps/web/server/scans/score-materialization-request-repository.test.ts \
            apps/web/server/scans/report-artifact-transfer.test.ts

      - name: Test public page request logging
        run: |
          node --import tsx --test \
            apps/web/lib/product-analytics/*.test.ts \
            apps/web/middleware.test.ts

      - name: Typecheck web
        id: web-typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          pnpm --filter @website-signal-risk-scanner/web typecheck
          echo "verified_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Test admin scan activity consistency
        env:
          ADMIN_ACTIVITY_TEST_DATABASE_URL: postgresql://postgres:local-fixture-only@localhost:5432/marketplace_browser_test
        run: |
          pnpm exec tsx --tsconfig apps/web/tsconfig.test.json --test \
            apps/web/lib/admin/admin-scan-activity.test.ts \
            apps/web/app/app/admin/scans/admin-scans-auto-refresh.test.ts \
            apps/web/app/app/admin/scans/admin-scans-filter-form.test.ts \
            apps/web/components/admin/admin-document-get-form.test.ts \
            apps/web/server/admin/admin-scan-activity-query.test.ts \
            apps/web/server/admin/admin-scan-operational-snapshot.test.ts \
            apps/web/server/admin/admin-operational-snapshot-consistency.test.ts

      - name: Test Marketplace Light security contracts
        run: |
          node --import tsx --test \
            apps/web/server/marketplace/contracts.test.ts \
            apps/web/server/marketplace/sns.test.ts \
            scripts/configure-marketplace-light.test.ts \
            apps/web/server/marketplace-browser/agreement.test.ts \
            apps/web/server/marketplace-browser/workspace-binding.test.ts \
            scripts/configure-marketplace-browser.test.ts \
            scripts/marketplace-browser-registration.test.ts

      - name: Test browser Marketplace transactions
        env:
          BROWSER_TEST_DATABASE_URL: postgresql://postgres:local-fixture-only@localhost:5432/marketplace_browser_test
          NODE_OPTIONS: --conditions=react-server
        run: node --import tsx --test apps/web/server/marketplace-browser/repository.test.ts

      - name: Validate certscore web runtime contract
        run: |
          APP_FLAVOR=certscore \
          NEXT_PUBLIC_APP_URL="${CERTSCORE_BASE_URL}" \
          DATABASE_URL=postgresql://localhost/certscore \
          BETTER_AUTH_SECRET=abcdefghijklmnopqrstuvwxyz123456 \
          GMAIL_SMTP_USER=ops@example.com \
          GMAIL_SMTP_APP_PASSWORD=placeholder \
          FEEDBACK_TO_EMAIL=ops@example.com \
          S3_BUCKET=placeholder-bucket \
          S3_REGION=us-west-1 \
          S3_ACCESS_KEY_ID=placeholder \
          S3_SECRET_ACCESS_KEY=placeholder \
          node --enable-source-maps --import tsx ./apps/web/scripts/check-amplify-runtime-env.ts

      - name: Select deployment from live web runtime inputs
        id: runtime-selection
        run: node scripts/select-workflow-deployment.mjs web

  verify-post-accept-forms:
    if: inputs.staged_run_id == ''
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_x64_fallback && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build form fixture dependencies
        run: node scripts/release-node.mjs scripts/bootstrap-release.ts

      - name: Install Chromium for form lifecycle release check
        run: pnpm --filter @certscore/scan-core exec playwright install --with-deps chromium

      - name: Verify post-Accept forms and images reach the report
        run: pnpm test:post-accept-forms



  deploy-public-web-aws:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_x64_fallback && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    needs: [verify-public-web, verify-post-accept-forms]
    if: >-
      ${{ !cancelled() && (
        (inputs.staged_run_id == '' && needs.verify-public-web.result == 'success' &&
          needs.verify-post-accept-forms.result == 'success' && needs.verify-public-web.outputs.deploy == 'true' &&
          (github.event_name != 'push' || vars.AWS_STAGED_COUPLED_RELEASES != 'true')) ||
        (inputs.staged_run_id != '' && needs.verify-public-web.result == 'skipped' &&
          needs.verify-post-accept-forms.result == 'skipped')) }}
    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      STAGED_RUN_ID: ${{ inputs.staged_run_id }}
      STAGED_IMAGE: ${{ inputs.staged_image }}
      STAGED_BASE_SHA: ${{ inputs.staged_base_sha }}
      WEB_COMPILER_CACHE_ENABLED: ${{ inputs.use_compiler_cache && '1' || '0' }}
      EXPERIMENTAL_BUILDKIT_SOURCE_POLICY: ${{ github.workspace }}/scripts/docker-source-policy.json
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_WEB_REPOSITORY: ${{ vars.AWS_WEB_ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.AWS_WEB_ECS_CLUSTER }}
      ECS_CERTSCORE_SERVICE_NAME: ${{ vars.AWS_WEB_CERTSCORE_SERVICE }}
      ECS_MATERIALIZER_SERVICE_NAME: ${{ vars.AWS_WEB_MATERIALIZER_SERVICE || 'certscore-web-materializer' }}
      MATERIALIZER_TASK_CPU: ${{ vars.AWS_WEB_MATERIALIZER_TASK_CPU || '1024' }}
      MATERIALIZER_TASK_MEMORY: ${{ vars.AWS_WEB_MATERIALIZER_TASK_MEMORY || '2048' }}
      CERTSCORE_BASE_URL: ${{ vars.AWS_WEB_CERTSCORE_BASE_URL }}
      CERTSCORE_CHROME_EXTENSION_STORE_URL: ${{ vars.CERTSCORE_CHROME_EXTENSION_STORE_URL || 'https://chromewebstore.google.com/detail/certscore-ai/mjeaagdiegpaeokkdaghkndmkjhlbhbp' }}

    steps:
      - name: Validate staged release invocation
        if: inputs.stage_only || inputs.staged_run_id != '' || inputs.staged_image != '' || inputs.staged_base_sha != ''
        env:
          STAGING_ENABLED: ${{ vars.AWS_STAGED_COUPLED_RELEASES }}
          STAGE_ONLY: ${{ inputs.stage_only }}
          STANDARD_SETTINGS: ${{ !inputs.use_compiler_cache && !inputs.push_runtime_base && !inputs.allow_non_descendant_deploy && !inputs.use_x64_fallback && inputs.marketplace_light == 'preserve' && inputs.marketplace_browser == 'preserve' }}
        run: |
          test "$STAGING_ENABLED" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$STANDARD_SETTINGS" = true
          [[ "$STAGED_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$STAGED_BASE_SHA" != "$GITHUB_SHA" ]] || exit 1
          if [[ "$STAGE_ONLY" == true ]]; then
            [[ -z "$STAGED_RUN_ID" && -z "$STAGED_IMAGE" ]] || exit 1
          else
            [[ "$STAGED_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
            [[ "$STAGED_IMAGE" =~ ^[1-9][0-9]{0,5}:sha256:[0-9a-f]{64}$ ]] || exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report deploy-triggering changes
        if: inputs.staged_run_id == ''
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${{ github.event.before }}" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          echo "Deploy trigger: public web"
          echo "Base ref: ${base_ref}"
          echo "Head ref: ${GITHUB_SHA}"
          echo
          echo "Changed files considered by this deploy:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | sed 's/^/  - /'
          echo
          echo "Deploy categories:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | awk '
            /^apps\/web\// { web=1 }
            /^apps\/web\/scripts\// { web_scripts=1 }
            /^apps\/web\/.*\.(test|spec)\.(ts|tsx)$/ { tests=1 }
            /^packages\/(shared|ui|db|validation-shared|certscore-contracts|certscore-vendor-resolver)\// { pkg=1 }
            /^scripts\/(apply-db-migrations|insert-integration-api-key)\.mjs$/ { ops=1 }
            /^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json|\.dockerignore)$/ { build=1 }
            /^\.github\/workflows\/web-aws-ecs-deploy\.yml$/ { workflow=1 }
            END {
              if (web) print "  - web source"
              if (web_scripts) print "  - web script-only change"
              if (tests) print "  - web test-only change"
              if (pkg) print "  - web runtime package"
              if (ops) print "  - web operational script"
              if (build) print "  - build/dependency config"
              if (workflow) print "  - deploy workflow"
            }
          '
          runtime_inputs_changed="$(node scripts/runtime-base-changes.mjs web "${base_ref}" "${GITHUB_SHA}")"
          echo "WEB_RUNTIME_INPUTS_CHANGED=${runtime_inputs_changed}" >> "${GITHUB_ENV}"
          runtime_fingerprint="$(node scripts/runtime-base-changes.mjs web --fingerprint "${GITHUB_SHA}")"
          echo "WEB_RUNTIME_INPUTS_FINGERPRINT=${runtime_fingerprint}" >> "${GITHUB_ENV}"

      - name: Validate deploy configuration
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || (echo "Missing secret AWS_ROLE_TO_ASSUME" && exit 1)
          test -n "${ECR_WEB_REPOSITORY}" || (echo "Missing var AWS_WEB_ECR_REPOSITORY" && exit 1)
          test -n "${ECS_CLUSTER_NAME}" || (echo "Missing var AWS_WEB_ECS_CLUSTER" && exit 1)
          test -n "${ECS_CERTSCORE_SERVICE_NAME}" || (echo "Missing var AWS_WEB_CERTSCORE_SERVICE" && exit 1)
          test -n "${CERTSCORE_BASE_URL}" || (echo "Missing var AWS_WEB_CERTSCORE_BASE_URL" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          inline-session-policy: >-
            ${{ inputs.stage_only && '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ecr:GetAuthorizationToken","ecr:DescribeImages","ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability","ecr:InitiateLayerUpload","ecr:UploadLayerPart","ecr:CompleteLayerUpload","ecr:PutImage"],"Resource":"*"}]}' || '' }}

      - name: Login to Amazon ECR
        if: inputs.staged_run_id == ''
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: inputs.staged_run_id == ''
        uses: docker/setup-buildx-action@v3

      - name: Report image build architecture
        if: inputs.staged_run_id == ''
        run: |
          echo "Runner architecture: ${RUNNER_ARCH}"
          echo "Target image platform: linux/arm64"
          if [[ "${RUNNER_ARCH}" == "ARM64" ]]; then
            echo "Using native ARM64 image construction."
          else
            echo "::warning::Using the emergency x64 emulation fallback for an ARM64 image."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: inputs.staged_run_id == ''
        run: pnpm install --frozen-lockfile

      - name: Prevent non-descendant production rollback
        env:
          STAGE_ONLY: ${{ inputs.stage_only }}
          ALLOW_NON_DESCENDANT_WEB_DEPLOY: ${{ github.event.inputs.allow_non_descendant_deploy || 'false' }}
          LIVE_WEB_BASE_URL: ${{ env.CERTSCORE_BASE_URL }}
        run: |
          if [[ "$STAGE_ONLY" == true ]]; then
            node --experimental-strip-types ./scripts/assert-forward-web-deploy.ts --target "$GITHUB_SHA" --expected-live-base "$STAGED_BASE_SHA" --require-live-base
          elif [[ -n "$STAGED_RUN_ID" ]]; then
            node --experimental-strip-types ./scripts/assert-forward-web-deploy.ts --target "$GITHUB_SHA" --expected-live-base "$STAGED_BASE_SHA"
          else
            pnpm exec tsx ./scripts/assert-forward-web-deploy.ts --target "${GITHUB_SHA}"
          fi

      - name: Restore bounded web compiler cache
        if: inputs.staged_run_id == '' && !inputs.stage_only && inputs.use_compiler_cache == true
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/web/saved
          key: web-compiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.mjs', 'apps/web/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            web-compiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.mjs', 'apps/web/tsconfig.json') }}-

      - name: Prepare compiler cache input
        if: inputs.staged_run_id == ''
        run: |
          if [[ "${WEB_COMPILER_CACHE_ENABLED}" == "1" ]]; then
            node scripts/web-compiler-cache.mjs .release-cache/web/saved .release-cache/web/input/compiler-cache
          else
            mkdir -p .release-cache/web/input/compiler-cache
          fi

      - name: Build and push public web image
        timeout-minutes: 60
        if: inputs.staged_run_id == ''
        env:
          STAGE_ONLY: ${{ inputs.stage_only }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          WEB_IMAGE="${REGISTRY}/${ECR_WEB_REPOSITORY}"
          WEB_CACHE="${WEB_IMAGE}:buildcache"
          WEB_RUNTIME_BASE_IMAGE="${WEB_IMAGE}:runtime-base"
          WEB_RUNTIME_BASE_CACHE="${WEB_IMAGE}:runtime-base-cache"

          if docker buildx imagetools inspect "${WEB_CACHE}" >/dev/null 2>&1; then
            echo "Registry build cache found: ${WEB_CACHE}"
          else
            echo "Registry build cache is absent or unavailable: ${WEB_CACHE}; expect a cold ARM64 build."
          fi

          if docker buildx imagetools inspect "${WEB_RUNTIME_BASE_IMAGE}" >/dev/null 2>&1; then
            echo "Reusable web runtime base found: ${WEB_RUNTIME_BASE_IMAGE}"
            base_fingerprint="$(docker buildx imagetools inspect "${WEB_RUNTIME_BASE_IMAGE}" --format '{{ index .Image.Config.Labels "org.certscore.runtime-inputs" }}' 2>/dev/null || true)"
            rebuild_runtime_base="1"
            if [[ -n "${WEB_RUNTIME_INPUTS_FINGERPRINT}" && "${base_fingerprint}" == "${WEB_RUNTIME_INPUTS_FINGERPRINT}" ]]; then
              rebuild_runtime_base="0"
            fi
          else
            echo "Reusable web runtime base is absent or unavailable: ${WEB_RUNTIME_BASE_IMAGE}; bootstrapping it now."
            rebuild_runtime_base="1"
          fi

          if [[ "${{ inputs.push_runtime_base || false }}" == "true" ]]; then rebuild_runtime_base="1"; fi
          if [[ "${rebuild_runtime_base}" == "1" ]]; then
          docker buildx build \
            --platform linux/arm64 \
            --progress=plain \
            --provenance=false \
            --sbom=false \
            --target web-runtime-base \
            --label "org.certscore.runtime-inputs=${WEB_RUNTIME_INPUTS_FINGERPRINT}" \
            --cache-from "type=registry,ref=${WEB_RUNTIME_BASE_CACHE}" \
            --cache-to "type=registry,ref=${WEB_RUNTIME_BASE_CACHE},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            -f apps/web/Dockerfile \
            -t "${WEB_RUNTIME_BASE_IMAGE}" \
            --push \
            .
          else
            echo "Reusing unchanged web runtime base without rebuilding or exporting it."
          fi

          heartbeat() {
            while sleep 60; do
              echo "::notice::Public web ARM64 image build is still active at $(date -u +%Y-%m-%dT%H:%M:%SZ). Inspect underlying BuildKit output before cancellation."
            done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "${heartbeat_pid}" 2>/dev/null || true' EXIT

          tags=(-t "${WEB_IMAGE}:${GITHUB_SHA}")
          if [[ "$STAGE_ONLY" != true ]]; then tags+=(-t "${WEB_IMAGE}:latest"); fi
          docker buildx build \
            --platform linux/arm64 \
            --progress=plain \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${WEB_CACHE}" \
            --cache-to "type=registry,ref=${WEB_CACHE},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            -f apps/web/Dockerfile \
            --build-context web-compiler-cache-input=.release-cache/web/input \
            --build-arg WEB_RUNTIME_BASE="${WEB_RUNTIME_BASE_IMAGE}" \
            --build-arg BUILD_GIT_REF="${GITHUB_REF_NAME}" \
            --build-arg BUILD_GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_IMAGE_TAG="${GITHUB_SHA}" \
            --build-arg BUILD_RUNTIME_TARGET="ecs-fargate" \
            --build-arg WEB_TYPECHECK_VERIFIED_SHA="${{ needs.verify-public-web.outputs.verified_sha }}" \
            --build-arg WEB_COMPILER_CACHE_ENABLED="${WEB_COMPILER_CACHE_ENABLED}" \
            --metadata-file "$RUNNER_TEMP/web-build-metadata.json" \
            "${tags[@]}" \
            --push \
            .

          kill "${heartbeat_pid}" 2>/dev/null || true
          wait "${heartbeat_pid}" 2>/dev/null || true
          trap - EXIT
          echo "TARGET_WEB_IMAGE=${WEB_IMAGE}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          if [[ "$STAGE_ONLY" == true ]]; then
            digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/web-build-metadata.json")
            jq -n --arg sha "$GITHUB_SHA" --arg typechecked '${{ needs.verify-public-web.outputs.verified_sha }}' \
              --arg runId "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg repo "$WEB_IMAGE" --arg digest "$digest" \
              '{version:1,sha:$sha,typecheckedSha:$typechecked,runId:$runId,attempt:$attempt,repository:$repo,digest:$digest}' > "$RUNNER_TEMP/staged-web.json"
          fi

      - name: Publish staged web image receipt
        if: inputs.stage_only
        uses: actions/upload-artifact@v4
        with:
          name: staged-web-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-web.json
          retention-days: 1
          if-no-files-found: error

      - name: Verify and select staged web image
        if: inputs.staged_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(node scripts/resolve-staged-ecs-image.mjs web "$ECR_WEB_REPOSITORY")
          echo "TARGET_WEB_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Apply database migrations from target web image
        if: ${{ !inputs.stage_only }}
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_CERTSCORE_SERVICE_NAME}" \
            --output json > service.json

          CURRENT_TASK_DEFINITION="$(jq -r '.services[0].taskDefinition // empty' service.json)"
          NETWORK_CONFIGURATION="$(jq -c '.services[0].networkConfiguration' service.json)"
          test -n "${CURRENT_TASK_DEFINITION}" || (echo "Could not resolve current web task definition" && exit 1)

          aws ecs describe-task-definition \
            --task-definition "${CURRENT_TASK_DEFINITION}" \
            --query taskDefinition \
            --output json > current-task-definition.json

          CONTAINER_NAME="$(jq -r '.containerDefinitions[0].name // empty' current-task-definition.json)"
          test -n "${CONTAINER_NAME}" || (echo "Could not resolve web container name" && exit 1)

          jq --arg image "${TARGET_WEB_IMAGE}" --arg extension_url "${CERTSCORE_CHROME_EXTENSION_STORE_URL}" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
            | .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = (
                [(.containerDefinitions[0].environment // [])[] | select(
                  .name != "CERTSCORE_CHROME_EXTENSION_STORE_URL"
                  and .name != "CERTSCORE_FULL_SITE_INTERNAL_ENABLED"
                  and .name != "CERTSCORE_POST_ACCEPT_WORKER_ENABLED"
                  and .name != "CERTSCORE_POST_ACCEPT_WORKER_ROLLOUT_MODE"
                  and .name != "CERTSCORE_POST_REFUSAL_REJECT_WORKER_ENABLED"
                  and .name != "CERTSCORE_POST_REFUSAL_REJECT_WORKER_ROLLOUT_MODE"
                  and .name != "CERTSCORE_SALE_SHARING_OPT_OUT_ENABLED"
                )]
                + [
                    {name:"CERTSCORE_CHROME_EXTENSION_STORE_URL",value:$extension_url},
                    {name:"CERTSCORE_FULL_SITE_INTERNAL_ENABLED",value:"1"},
                    {name:"CERTSCORE_POST_ACCEPT_WORKER_ENABLED",value:"1"},
                    {name:"CERTSCORE_POST_ACCEPT_WORKER_ROLLOUT_MODE",value:"all_eligible"},
                    {name:"CERTSCORE_POST_REFUSAL_REJECT_WORKER_ENABLED",value:"1"},
                    {name:"CERTSCORE_POST_REFUSAL_REJECT_WORKER_ROLLOUT_MODE",value:"all_eligible"},
                    {name:"CERTSCORE_SALE_SHARING_OPT_OUT_ENABLED",value:"1"}
                  ]
              )
          ' current-task-definition.json > target-task-definition.json
          node_types=(node --import tsx)
          if [[ -n "$STAGED_RUN_ID" ]]; then node_types=(node --experimental-strip-types); fi
          "${node_types[@]}" scripts/configure-marketplace-light.ts target-task-definition.json "${{ inputs.marketplace_light || 'preserve' }}"
          "${node_types[@]}" scripts/configure-marketplace-browser.ts target-task-definition.json "${{ inputs.marketplace_browser || 'preserve' }}"

          TARGET_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://target-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "TARGET_TASK_DEFINITION=${TARGET_TASK_DEFINITION}" >> "${GITHUB_ENV}"

          # Projection is CPU-heavy and intentionally isolated from public web
          # traffic. Register a distinct family so giving the materializer one
          # full vCPU does not increase the public service's task size or let a
          # later web revision silently return it to 0.5 vCPU.
          jq --arg cpu "${MATERIALIZER_TASK_CPU}" --arg memory "${MATERIALIZER_TASK_MEMORY}" '
            .family = (.family + "-materializer")
            | .cpu = $cpu
            | .memory = $memory
          ' target-task-definition.json > target-materializer-task-definition.json

          TARGET_MATERIALIZER_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://target-materializer-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "TARGET_MATERIALIZER_TASK_DEFINITION=${TARGET_MATERIALIZER_TASK_DEFINITION}" >> "${GITHUB_ENV}"

          EXPECTED_LATEST_MIGRATION="$(find packages/db/migrations -maxdepth 1 -type f -name '*.sql' -exec basename {} \; | sort | tail -1)"
          AUXILIARY_OVERRIDES="$(jq -c --arg primary "${CONTAINER_NAME}" '[
            .containerDefinitions[]
            | select(.name != $primary)
            | {name:.name,command:["sh","-c","exit 0"]}
          ]' current-task-definition.json)"
          OVERRIDES="$(jq -nc --arg name "${CONTAINER_NAME}" --arg latest "${EXPECTED_LATEST_MIGRATION}" --argjson auxiliary "${AUXILIARY_OVERRIDES}" '{containerOverrides:([{
            name:$name,
            command:["node","./apps/web/scripts/apply-db-migrations.mjs"],
            environment:[
              {name:"DEPLOY_TARGET_GIT_SHA",value:env.GITHUB_SHA},
              {name:"EXPECTED_LATEST_MIGRATION",value:$latest},
              {name:"PGCONNECT_TIMEOUT",value:"15"},
              {name:"PGOPTIONS",value:"-c lock_timeout=10000 -c statement_timeout=60000"}
            ]
          }] + $auxiliary)}')"

          TASK_ARN="$(aws ecs run-task \
            --cluster "${ECS_CLUSTER_NAME}" \
            --task-definition "${TARGET_TASK_DEFINITION}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIGURATION}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' \
            --output text)"
          test -n "${TASK_ARN}" || (echo "Migration task did not start" && exit 1)
          node scripts/wait-for-ecs-migration.mjs "$ECS_CLUSTER_NAME" "$TASK_ARN" "$TARGET_TASK_DEFINITION" "$CONTAINER_NAME"

      - name: Force ECS deployments
        if: ${{ !inputs.stage_only }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_CERTSCORE_SERVICE_NAME}" \
            --task-definition "${TARGET_TASK_DEFINITION}" \
            --force-new-deployment >/dev/null

          materializer_status="$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_MATERIALIZER_SERVICE_NAME}" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)"
          if [[ "${materializer_status}" == "ACTIVE" ]]; then
            aws ecs update-service \
              --cluster "${ECS_CLUSTER_NAME}" \
              --service "${ECS_MATERIALIZER_SERVICE_NAME}" \
              --task-definition "${TARGET_MATERIALIZER_TASK_DEFINITION}" \
              --force-new-deployment >/dev/null
            echo "MATERIALIZER_SERVICE_DEPLOYED=true" >> "${GITHUB_ENV}"
          else
            echo "Dedicated materializer service is not provisioned yet; public web deployment will continue."
            echo "MATERIALIZER_SERVICE_DEPLOYED=false" >> "${GITHUB_ENV}"
          fi

      - name: Export successful compiler cache
        if: inputs.staged_run_id == '' && !inputs.stage_only && inputs.use_compiler_cache == true
        id: compiler-export
        continue-on-error: true
        timeout-minutes: 5
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          WEB_IMAGE="${REGISTRY}/${ECR_WEB_REPOSITORY}"
          docker buildx build --platform linux/arm64 --progress=plain \
            --provenance=false --sbom=false --target web-compiler-cache-export \
            --cache-from "type=registry,ref=${WEB_IMAGE}:buildcache" \
            --build-context web-compiler-cache-input=.release-cache/web/input \
            --build-arg WEB_RUNTIME_BASE="${WEB_IMAGE}:runtime-base" \
            --build-arg BUILD_GIT_REF="${GITHUB_REF_NAME}" \
            --build-arg BUILD_GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_IMAGE_TAG="${GITHUB_SHA}" \
            --build-arg BUILD_RUNTIME_TARGET="ecs-fargate" \
            --build-arg WEB_TYPECHECK_VERIFIED_SHA="${{ needs.verify-public-web.outputs.verified_sha }}" \
            --build-arg WEB_COMPILER_CACHE_ENABLED="${WEB_COMPILER_CACHE_ENABLED}" \
            --output type=local,dest=.release-cache/web/export -f apps/web/Dockerfile .
          node scripts/web-compiler-cache.mjs .release-cache/web/export/compiler-cache .release-cache/web/saved

      - name: Save bounded compiler cache
        if: inputs.staged_run_id == '' && !inputs.stage_only && inputs.use_compiler_cache == true && steps.compiler-export.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .release-cache/web/saved
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Install staged promotion reporting dependencies
        id: promotion-deps
        if: inputs.staged_run_id != ''
        continue-on-error: true
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Wait for ECS services to stabilize
        if: ${{ !inputs.stage_only }}
        run: |
          services=("${ECS_CERTSCORE_SERVICE_NAME}")
          if [[ "${MATERIALIZER_SERVICE_DEPLOYED}" == "true" ]]; then
            services+=("${ECS_MATERIALIZER_SERVICE_NAME}")
          fi
          if [[ -z "$STAGED_RUN_ID" ]]; then
            aws ecs wait services-stable --cluster "${ECS_CLUSTER_NAME}" --services "${services[@]}"
          else
            expected=("$ECS_CERTSCORE_SERVICE_NAME" "$TARGET_TASK_DEFINITION")
            if [[ "${MATERIALIZER_SERVICE_DEPLOYED}" == "true" ]]; then
              expected+=("$ECS_MATERIALIZER_SERVICE_NAME" "$TARGET_MATERIALIZER_TASK_DEFINITION")
            fi
            node scripts/wait-for-staged-ecs.mjs "$ECS_CLUSTER_NAME" "${expected[@]}"
          fi

      - name: Submit IndexNow URLs
        if: ${{ !inputs.stage_only }}
        env:
          PROMOTION_DEPS: ${{ steps.promotion-deps.outcome }}
        run: |
          if [[ -n "$STAGED_RUN_ID" ]]; then test "$PROMOTION_DEPS" = success || exit 1; fi
          pnpm --filter @website-signal-risk-scanner/web indexnow:submit
