name: Public Web AWS ECS Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/web-aws-ecs-deploy.yml"
      - "apps/web/**"
      - "packages/certscore-contracts/**"
      - "packages/certscore-vendor-resolver/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/validation-shared/**"
      - "scripts/apply-db-migrations.mjs"
      - "scripts/assert-forward-web-deploy.ts"
      - "scripts/insert-integration-api-key.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "!apps/web/**/*.test.ts"
      - "!apps/web/**/*.test.tsx"
      - "!apps/web/**/*.spec.ts"
      - "!apps/web/**/*.spec.tsx"
      - "!apps/web/scripts/**"
  workflow_dispatch:
    inputs:
      allow_non_descendant_deploy:
        description: "Emergency only: permit a web revision that does not contain the currently live revision"
        required: false
        default: false
        type: boolean

concurrency:
  group: public-web-aws-production
  cancel-in-progress: false

jobs:
  deploy-public-web-aws:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_WEB_REPOSITORY: ${{ vars.AWS_WEB_ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.AWS_WEB_ECS_CLUSTER }}
      ECS_CERTSCORE_SERVICE_NAME: ${{ vars.AWS_WEB_CERTSCORE_SERVICE }}
      CERTSCORE_BASE_URL: ${{ vars.AWS_WEB_CERTSCORE_BASE_URL }}
      CERTSCORE_CHROME_EXTENSION_STORE_URL: ${{ vars.CERTSCORE_CHROME_EXTENSION_STORE_URL || 'https://chromewebstore.google.com/detail/certscore-ai/mjeaagdiegpaeokkdaghkndmkjhlbhbp' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report deploy-triggering changes
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${{ github.event.before }}" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          echo "Deploy trigger: public web"
          echo "Base ref: ${base_ref}"
          echo "Head ref: ${GITHUB_SHA}"
          echo
          echo "Changed files considered by this deploy:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | sed 's/^/  - /'
          echo
          echo "Deploy categories:"
          git diff --name-only "${base_ref}" "${GITHUB_SHA}" | awk '
            /^apps\/web\// { web=1 }
            /^apps\/web\/scripts\// { web_scripts=1 }
            /^apps\/web\/.*\.(test|spec)\.(ts|tsx)$/ { tests=1 }
            /^packages\/(shared|ui|db|validation-shared|certscore-contracts|certscore-vendor-resolver)\// { pkg=1 }
            /^scripts\/(apply-db-migrations|insert-integration-api-key)\.mjs$/ { ops=1 }
            /^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json|\.dockerignore)$/ { build=1 }
            /^\.github\/workflows\/web-aws-ecs-deploy\.yml$/ { workflow=1 }
            END {
              if (web) print "  - web source"
              if (web_scripts) print "  - web script-only change"
              if (tests) print "  - web test-only change"
              if (pkg) print "  - web runtime package"
              if (ops) print "  - web operational script"
              if (build) print "  - build/dependency config"
              if (workflow) print "  - deploy workflow"
            }
          '

      - name: Validate deploy configuration
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || (echo "Missing secret AWS_ROLE_TO_ASSUME" && exit 1)
          test -n "${ECR_WEB_REPOSITORY}" || (echo "Missing var AWS_WEB_ECR_REPOSITORY" && exit 1)
          test -n "${ECS_CLUSTER_NAME}" || (echo "Missing var AWS_WEB_ECS_CLUSTER" && exit 1)
          test -n "${ECS_CERTSCORE_SERVICE_NAME}" || (echo "Missing var AWS_WEB_CERTSCORE_SERVICE" && exit 1)
          test -n "${CERTSCORE_BASE_URL}" || (echo "Missing var AWS_WEB_CERTSCORE_BASE_URL" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prevent non-descendant production rollback
        env:
          ALLOW_NON_DESCENDANT_WEB_DEPLOY: ${{ github.event.inputs.allow_non_descendant_deploy || 'false' }}
          LIVE_WEB_BASE_URL: ${{ env.CERTSCORE_BASE_URL }}
        run: pnpm exec tsx ./scripts/assert-forward-web-deploy.ts --target "${GITHUB_SHA}"

      - name: Build scan-source test dependencies
        run: |
          pnpm --filter @website-signal-risk-scanner/shared build
          pnpm --filter @website-signal-risk-scanner/ui build
          pnpm --filter @website-signal-risk-scanner/db build

      - name: Test scan-source contracts
        run: |
          node --import tsx --test \
            apps/web/components/marketing/domain-scan-form.test.ts \
            apps/web/components/scans/scan-from-select.test.tsx \
            apps/web/server/scans/recent-scan-reuse.test.ts \
            apps/web/server/scans/restricted-scan-options.test.ts \
            scripts/assert-forward-web-deploy.test.ts \
            scripts/web-deployment-skew-protection.test.ts

      - name: Typecheck web
        run: pnpm --filter @website-signal-risk-scanner/web typecheck

      - name: Validate certscore web runtime contract
        run: |
          APP_FLAVOR=certscore \
          NEXT_PUBLIC_APP_URL="${CERTSCORE_BASE_URL}" \
          DATABASE_URL=postgresql://localhost/certscore \
          BETTER_AUTH_SECRET=abcdefghijklmnopqrstuvwxyz123456 \
          GMAIL_SMTP_USER=ops@example.com \
          GMAIL_SMTP_APP_PASSWORD=placeholder \
          FEEDBACK_TO_EMAIL=ops@example.com \
          S3_BUCKET=placeholder-bucket \
          S3_REGION=us-west-1 \
          S3_ACCESS_KEY_ID=placeholder \
          S3_SECRET_ACCESS_KEY=placeholder \
          node --enable-source-maps --import tsx ./apps/web/scripts/check-amplify-runtime-env.ts

      - name: Build and push public web image
        timeout-minutes: 60
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          WEB_IMAGE="${REGISTRY}/${ECR_WEB_REPOSITORY}"
          WEB_CACHE="${WEB_IMAGE}:buildcache"

          if docker buildx imagetools inspect "${WEB_CACHE}" >/dev/null 2>&1; then
            echo "Registry build cache found: ${WEB_CACHE}"
          else
            echo "Registry build cache is absent or unavailable: ${WEB_CACHE}; expect a cold ARM64 build."
          fi

          heartbeat() {
            while sleep 60; do
              echo "::notice::Public web ARM64 image build is still active at $(date -u +%Y-%m-%dT%H:%M:%SZ). Cold emulated builds may take 45-60 minutes; inspect underlying BuildKit output before cancellation."
            done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "${heartbeat_pid}" 2>/dev/null || true' EXIT

          docker buildx build \
            --platform linux/arm64 \
            --progress=plain \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=${WEB_CACHE}" \
            -f apps/web/Dockerfile \
            --build-arg BUILD_GIT_REF="${GITHUB_REF_NAME}" \
            --build-arg BUILD_GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_IMAGE_TAG="${GITHUB_SHA}" \
            --build-arg BUILD_RUNTIME_TARGET="ecs-fargate" \
            -t "${WEB_IMAGE}:${GITHUB_SHA}" \
            -t "${WEB_IMAGE}:latest" \
            --push \
            .
          kill "${heartbeat_pid}" 2>/dev/null || true
          wait "${heartbeat_pid}" 2>/dev/null || true
          trap - EXIT
          echo "TARGET_WEB_IMAGE=${WEB_IMAGE}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Apply database migrations from target web image
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_CERTSCORE_SERVICE_NAME}" \
            --output json > service.json

          CURRENT_TASK_DEFINITION="$(jq -r '.services[0].taskDefinition // empty' service.json)"
          NETWORK_CONFIGURATION="$(jq -c '.services[0].networkConfiguration' service.json)"
          test -n "${CURRENT_TASK_DEFINITION}" || (echo "Could not resolve current web task definition" && exit 1)

          aws ecs describe-task-definition \
            --task-definition "${CURRENT_TASK_DEFINITION}" \
            --query taskDefinition \
            --output json > current-task-definition.json

          CONTAINER_NAME="$(jq -r '.containerDefinitions[0].name // empty' current-task-definition.json)"
          test -n "${CONTAINER_NAME}" || (echo "Could not resolve web container name" && exit 1)

          jq --arg image "${TARGET_WEB_IMAGE}" --arg extension_url "${CERTSCORE_CHROME_EXTENSION_STORE_URL}" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
            | .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = (
                [(.containerDefinitions[0].environment // [])[] | select(.name != "CERTSCORE_CHROME_EXTENSION_STORE_URL")]
                + [{name:"CERTSCORE_CHROME_EXTENSION_STORE_URL",value:$extension_url}]
              )
          ' current-task-definition.json > target-task-definition.json

          TARGET_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://target-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "TARGET_TASK_DEFINITION=${TARGET_TASK_DEFINITION}" >> "${GITHUB_ENV}"

          EXPECTED_LATEST_MIGRATION="$(find packages/db/migrations -maxdepth 1 -type f -name '*.sql' -exec basename {} \; | sort | tail -1)"
          AUXILIARY_OVERRIDES="$(jq -c --arg primary "${CONTAINER_NAME}" '[
            .containerDefinitions[]
            | select(.name != $primary)
            | {name:.name,command:["sh","-c","exit 0"]}
          ]' current-task-definition.json)"
          OVERRIDES="$(jq -nc --arg name "${CONTAINER_NAME}" --arg latest "${EXPECTED_LATEST_MIGRATION}" --argjson auxiliary "${AUXILIARY_OVERRIDES}" '{containerOverrides:([{
            name:$name,
            command:["node","./apps/web/scripts/apply-db-migrations.mjs"],
            environment:[
              {name:"DEPLOY_TARGET_GIT_SHA",value:env.GITHUB_SHA},
              {name:"EXPECTED_LATEST_MIGRATION",value:$latest},
              {name:"PGCONNECT_TIMEOUT",value:"15"},
              {name:"PGOPTIONS",value:"-c lock_timeout=10000 -c statement_timeout=60000"}
            ]
          }] + $auxiliary)}')"

          TASK_ARN="$(aws ecs run-task \
            --cluster "${ECS_CLUSTER_NAME}" \
            --task-definition "${TARGET_TASK_DEFINITION}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIGURATION}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' \
            --output text)"
          test -n "${TASK_ARN}" || (echo "Migration task did not start" && exit 1)
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER_NAME}" --tasks "${TASK_ARN}"
          EXIT_CODE="$(aws ecs describe-tasks --cluster "${ECS_CLUSTER_NAME}" --tasks "${TASK_ARN}" --query 'tasks[0].containers[0].exitCode' --output text)"
          test "${EXIT_CODE}" = "0" || (echo "Migration task failed with exit code ${EXIT_CODE}" && exit 1)

      - name: Force ECS deployments
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_CERTSCORE_SERVICE_NAME}" \
            --task-definition "${TARGET_TASK_DEFINITION}" \
            --force-new-deployment >/dev/null

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable --cluster "${ECS_CLUSTER_NAME}" --services "${ECS_CERTSCORE_SERVICE_NAME}"

      - name: Submit IndexNow URLs
        run: pnpm --filter @website-signal-risk-scanner/web indexnow:submit
