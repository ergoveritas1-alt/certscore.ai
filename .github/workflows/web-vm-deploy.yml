name: Web VM Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-vm-deploy.yml"
      - "apps/web/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "packages/validation-shared/**"
      - "deploy-web-vm.sh"
      - "deploy/caddy/Caddyfile"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: web-vm-deploy-production
  cancel-in-progress: false

jobs:
  deploy-web-vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: certscore-ai
      REGION: us-central1
      REPOSITORY: certscore
      VM_NAME: certscore-web-prod
      VM_ZONE: us-central1-a
      PUBLIC_BASE_URL: https://consentcheck.site
      BUILD_SERVICE_ACCOUNT: certscore-build-sa@certscore-ai.iam.gserviceaccount.com
      DEPLOY_SERVICE_ACCOUNT: github-web-deploy-sa@certscore-ai.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/375479222526/locations/global/workloadIdentityPools/github-actions/providers/github-actions-certscore-ai
      REMOTE_DEPLOY_WRAPPER: /usr/local/bin/deploy-certscore-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy web to fixed-egress VM
        env:
          BUILD_STRATEGY: docker
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_TO_VM: "1"
        run: bash ./deploy-web-vm.sh
