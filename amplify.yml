version: 1
applications:
  - appRoot: apps/web
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: apps/web
        BUILD_RUNTIME_TARGET: amplify
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - rm -f apps/web/.env.production
            - env | grep -e '^NEXT_PUBLIC_' >> apps/web/.env.production || true
            - env | grep -e '^APP_FLAVOR=' -e '^VALIDATION_OPS_BASE_URL=' -e '^BUILD_RUNTIME_TARGET=' -e '^S3_BUCKET=' -e '^S3_REGION=' -e '^S3_ENDPOINT=' -e '^S3_FORCE_PATH_STYLE=' -e '^DATABASE_SSL_MODE=' -e '^DATABASE_URL=' -e '^DATABASE_READ_URL=' -e '^BETTER_AUTH_SECRET=' -e '^S3_ACCESS_KEY_ID=' -e '^S3_SECRET_ACCESS_KEY=' -e '^OPENAI_API_KEY=' >> apps/web/.env.production || true
            - |
              node <<'EOF'
              const fs = require("node:fs");
              const outputPath = "apps/web/.env.production";
              const rawSecrets = process.env.secrets?.trim();

              if (!rawSecrets) {
                process.exit(0);
              }

              let parsedSecrets;

              try {
                parsedSecrets = JSON.parse(rawSecrets);
              } catch (error) {
                console.error("[amplify] failed to parse process.env.secrets JSON", error);
                process.exit(1);
              }

              if (!parsedSecrets || typeof parsedSecrets !== "object" || Array.isArray(parsedSecrets)) {
                console.error("[amplify] process.env.secrets must be a JSON object");
                process.exit(1);
              }

              for (const key of ["DATABASE_URL", "DATABASE_READ_URL", "BETTER_AUTH_SECRET", "S3_ACCESS_KEY_ID", "S3_SECRET_ACCESS_KEY", "OPENAI_API_KEY"]) {
                const value = parsedSecrets[key];

                if (typeof value === "string" && value.length > 0) {
                  fs.appendFileSync(outputPath, `${key}=${JSON.stringify(value)}\n`);
                }
              }
              EOF
            - pnpm --filter @website-signal-risk-scanner/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
          - apps/web/.next/cache/**/*
