<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CertScore.ai Chrome Web Store marquee</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; width: 100%; }
      body {
        background:
          radial-gradient(circle at 78% 78%, rgba(0, 194, 255, 0.18), transparent 29%),
          radial-gradient(circle at 12% 8%, rgba(27, 113, 255, 0.16), transparent 34%),
          #03122f;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .canvas {
        align-items: center;
        display: grid;
        grid-template-columns: 56% 44%;
        height: 560px;
        overflow: hidden;
        position: relative;
        width: 1400px;
      }
      .copy {
        padding: 68px 36px 68px 88px;
        position: relative;
        z-index: 2;
      }
      .brand {
        align-items: center;
        display: flex;
        gap: 18px;
        margin-bottom: 46px;
      }
      .brand img { height: 70px; object-fit: contain; width: 80px; }
      .wordmark {
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      .wordmark em { color: #83c936; font-style: normal; }
      h1 {
        font-size: 55px;
        letter-spacing: -2.3px;
        line-height: 1.04;
        margin: 0 0 22px;
        max-width: 700px;
      }
      p {
        color: #c8d8ec;
        font-size: 24px;
        line-height: 1.45;
        margin: 0;
        max-width: 650px;
      }
      .art {
        align-self: stretch;
        background-image:
          linear-gradient(90deg, #03122f 0%, rgba(3,18,47,.35) 18%, rgba(3,18,47,0) 42%),
          url("small-promo-440x280.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        filter: saturate(1.08);
        position: relative;
      }
      .art::after {
        background: linear-gradient(180deg, rgba(3,18,47,.1), rgba(3,18,47,.38));
        content: "";
        inset: 0;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="copy">
        <div class="brand">
          <img src="../assets/certscore-mark-cropped.png" alt="" />
          <div class="wordmark">CertScore<em>.ai</em></div>
        </div>
        <h1>See what websites reveal before consent.</h1>
        <p>Browser-assisted evidence for GDPR, privacy, cookies, trackers, consent controls, and public trust signals.</p>
      </section>
      <div class="art" aria-hidden="true"></div>
    </main>
  </body>
</html>
