interface:
  display_name: "Website Privacy Preflight"
  short_description: "Review privacy and post-refusal evidence"
  default_prompt: "Use $website-privacy-preflight to review this public website's privacy signals, including eligible bounded post-refusal cookie or tracker observations."
dependencies:
  tools:
    - type: "mcp"
      value: "certscore"
      description: "CertScore.ai public-website privacy scanner with eligible bounded post-refusal cookie and tracker observation"
      transport: "streamable_http"
      url: "https://mcp.certscore.ai/mcp/light"
policy:
  allow_implicit_invocation: true
