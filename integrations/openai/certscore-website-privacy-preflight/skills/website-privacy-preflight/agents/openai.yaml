interface:
  display_name: "Website Privacy Preflight"
  short_description: "Preview cookies and trackers, then report"
  default_prompt: "Use $website-privacy-preflight to show any fast preliminary cookie and tracker evidence, then continue to the completed privacy report."
dependencies:
  tools:
    - type: "mcp"
      value: "certscore"
      description: "CertScore.ai public-website privacy scanner with fast preliminary cookie/tracker evidence and eligible bounded post-refusal observation"
      transport: "streamable_http"
      url: "https://mcp.certscore.ai/mcp/light"
policy:
  allow_implicit_invocation: true
