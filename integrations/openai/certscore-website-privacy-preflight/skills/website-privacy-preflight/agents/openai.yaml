interface:
  display_name: "Website Privacy Preflight"
  short_description: "Preview privacy evidence, then report"
  default_prompt: "Use $website-privacy-preflight to show any fast preliminary cookie and tracker evidence, then report the completed scan's typed GPC, Accept Path, and Reject Path results."
dependencies:
  tools:
    - type: "mcp"
      value: "certscore"
      description: "CertScore.ai public-website privacy scanner with fast preliminary cookie and tracker evidence, typed GPC comparisons, and eligible bounded Accept and Reject observations"
      transport: "streamable_http"
      url: "https://mcp.certscore.ai/mcp/light"
policy:
  allow_implicit_invocation: true
